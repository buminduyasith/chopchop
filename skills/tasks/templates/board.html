<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chopchop board</title>
<!--
  chopchop task board. This file is a fixed template: chopchop_tasks.py --status copies it and puts
  the task data in place of the marker below. Do not edit the generated board.html by hand.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --panel: #ebecf0; --card: #ffffff; --text: #172b4d; --muted: #5e6c84;
  --line: #dfe1e6; --shadow: 0 1px 2px rgba(9, 30, 66, .25);
  --todo: #6b778c; --progress: #0c66e4; --review: #6e5dc6; --done: #1f845a;
  --warn-bg: #fff7d6; --warn: #7f5f01; --info-bg: #e9f2ff; --info: #0c66e4;
  --chip: #f1f2f4; --code: #f4f5f7; --overlay: rgba(9, 30, 66, .54);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d2125; --panel: #22272b; --card: #2c333a; --text: #dee4ea; --muted: #9fadbc;
    --line: #38414a; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    --todo: #8c9bab; --progress: #579dff; --review: #9f8fef; --done: #4bce97;
    --warn-bg: #533f04; --warn: #f5cd47; --info-bg: #09326c; --info: #85b8ff;
    --chip: #38414a; --code: #22272b; --overlay: rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

header { padding: 20px 24px 12px; }
.crumb { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h1 { margin: 4px 0 10px; font-size: 22px; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.chip { background: var(--chip); border-radius: 4px; padding: 2px 6px; font-size: 12px; white-space: nowrap; }
.branch { display: inline-flex; gap: 6px; align-items: center; }
.progress { margin-top: 14px; display: flex; align-items: center; gap: 10px; max-width: 520px; }
.bar { flex: 1; height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; display: flex; }
.bar span { height: 100%; }
.progress b { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }

.toolbar { display: flex; gap: 8px; padding: 0 24px 12px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { background: var(--card); color: var(--text); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; font: inherit; }
.toolbar input { width: 220px; max-width: 100%; }
.toolbar .spacer { flex: 1; }
.btn { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 24px 32px;
  overflow-x: auto; align-items: start; }
.col { background: var(--panel); border-radius: 6px; padding: 8px; min-height: 120px; }
.col h2 { margin: 2px 4px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); display: flex; align-items: center; gap: 8px; }
.col h2 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.col h2 .n { margin-left: auto; font-weight: 500; }
.empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0; }

.card { background: var(--card); border-radius: 4px; box-shadow: var(--shadow); padding: 10px 10px 8px;
  margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100%; display: block; }
.card:hover { border-color: var(--progress); }
.card:focus-visible { outline: 2px solid var(--progress); outline-offset: 1px; }
.card .top { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.card .title { margin: 6px 0 8px; font-weight: 500; }
.card .bottom { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .owner { margin-left: auto; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff; }
.avatar.none { background: var(--chip); color: var(--muted); }
.badge { border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 500; }
.badge.wait { background: var(--warn-bg); color: var(--warn); }
.badge.chg { background: var(--info-bg); color: var(--info); }
.badge.pr { background: var(--chip); color: var(--text); text-decoration: none; }
.badge.auto { background: var(--info-bg); color: var(--info); }
.badge.auto.stopped, .badge.auto.skipped { background: var(--warn-bg); color: var(--warn); }

dialog { border: 0; border-radius: 8px; padding: 0; width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--card); color: var(--text); box-shadow: 0 8px 32px rgba(9, 30, 66, .35); }
dialog::backdrop { background: var(--overlay); }
.dlg-head { position: sticky; top: 0; background: var(--card); padding: 18px 22px 12px; border-bottom: 1px solid var(--line);
  display: flex; gap: 12px; align-items: flex-start; z-index: 1; }
.dlg-head h3 { margin: 4px 0 0; font-size: 20px; font-weight: 600; }
.dlg-head .close { margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer;
  color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.dlg-head .close:hover { background: var(--chip); }
.dlg-body { display: grid; grid-template-columns: 1fr 230px; gap: 24px; padding: 16px 22px 24px; }
.pill { color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; }
.facts { font-size: 13px; }
.facts dt { color: var(--muted); font-size: 12px; margin-top: 12px; }
.facts dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.facts dd .chip { display: inline-block; margin: 0 4px 4px 0; }
.copy { background: none; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 11px; padding: 1px 6px;
  margin-left: 4px; color: var(--muted); }
.md { min-width: 0; }
.md h1 { display: none; }
.md h2 { font-size: 15px; margin: 20px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md h2:first-child { margin-top: 0; }
.md h3 { font-size: 14px; margin: 14px 0 4px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li.task { list-style: none; margin-left: -20px; }
.md li.task input { margin: 0 6px 0 0; vertical-align: -2px; }
.md code { background: var(--code); border-radius: 3px; padding: 1px 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.md pre { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md a { color: var(--progress); }
.md em { color: var(--muted); }
.log { list-style: none; padding: 0; margin: 0; }
.log li { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.log .head { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.log .head b { color: var(--text); }
.log .text { white-space: pre-wrap; }
.dlg-only { padding: 16px 22px 24px; }
footer { color: var(--muted); font-size: 12px; padding: 0 24px 24px; }

@media (max-width: 1000px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  header, .toolbar { padding-left: 16px; padding-right: 16px; }
  .board { grid-template-columns: 1fr; padding: 0 16px 24px; }
  .dlg-body { grid-template-columns: 1fr; }
  .toolbar input { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="crumb" id="crumb"></div>
  <h1 id="title">chopchop board</h1>
  <div class="meta" id="meta"></div>
  <div class="progress"><div class="bar" id="bar"></div><b id="pct"></b></div>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks">
  <select id="repo" aria-label="Filter by repo"><option value="">All repos</option></select>
  <select id="owner" aria-label="Filter by owner"><option value="">All owners</option></select>
  <span class="spacer"></span>
  <button class="btn" id="logBtn" type="button">Changelog</button>
</div>
<main class="board" id="board"></main>
<footer id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<script id="chopchop-data" type="application/json">/*__CHOPCHOP_DATA__*/null</script>
<script>
(function () {
  "use strict";
  var raw = document.getElementById("chopchop-data").textContent.trim();
  var DATA = raw && raw !== "/*__CHOPCHOP_DATA__*/null" ? JSON.parse(raw) : null;
  if (!DATA) {
    document.getElementById("board").innerHTML = '<p class="empty">No data. Run chopchop_tasks.py --status.</p>';
    return;
  }

  var COLORS = { "todo": "var(--todo)", "in-progress": "var(--progress)", "in-review": "var(--review)", "done": "var(--done)" };
  var AVATAR = ["#0c66e4", "#6e5dc6", "#1f845a", "#c9372c", "#a54800", "#206a83", "#943d73"];
  var byId = {};
  DATA.tasks.forEach(function (t) { byId[t.id] = t; });
  var statusTitle = {};
  DATA.statuses.forEach(function (s) { statusTitle[s.id] = s.title; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function el(id) { return document.getElementById(id); }
  function initials(name) {
    var parts = String(name).split(/[\s._-]+/).filter(Boolean);
    return ((parts[0] || "?")[0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function avatar(name) {
    if (!name) return '<span class="avatar none" title="Unassigned">?</span>';
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return '<span class="avatar" title="' + esc(name) + '" style="background:' + AVATAR[h % AVATAR.length] + '">' +
      esc(initials(name)) + "</span>";
  }
  function pill(status) {
    return '<span class="pill" style="background:' + (COLORS[status] || "var(--todo)") + '">' +
      esc(statusTitle[status] || status) + "</span>";
  }

  // ------------------------------------------------------------------ markdown (small subset)

  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, href) {
      var safe = /^(https?:|mailto:|#|\.{0,2}\/|[\w.-]+\.\w+)/i.test(href) && !/^javascript:/i.test(href);
      return safe ? '<a href="' + href + '" target="_blank" rel="noopener">' + text + "</a>" : text;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])_([^_]+)_(?=[\s).,:;!?]|$)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[\s(])\*([^*]+)\*(?=[\s).,:;!?]|$)/g, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + esc(codes[+i]) + "</code>"; });
  }

  function markdown(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    var out = [], i = 0;
    function isTableSep(l) { return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l); }
    function cells(l) { return l.trim().replace(/^\|/, "").replace(/\|$/, "").split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, "|"); }); }
    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(/^\s*```(\S*)/);
      if (fence) {
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push('<pre><code class="lang-' + esc(fence[1]) + '">' + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
      if (/^\s*>/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
        out.push("<blockquote>" + markdown(q.join("\n")) + "</blockquote>");
        continue;
      }
      if (/^\s*\|/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = cells(line), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push("<table><thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table>");
        continue;
      }
      var li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if (li) {
        var ordered = /\d/.test(li[2]), items = [];
        while (i < lines.length) {
          var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if (m) { items.push(m[3]); i++; continue; }
          if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1] += " " + lines[i].trim(); i++; continue; }
          break;
        }
        out.push((ordered ? "<ol>" : "<ul>") + items.map(function (it) {
          var box = it.match(/^\[([ xX])\]\s+(.*)$/);
          if (box) return '<li class="task"><input type="checkbox" disabled' + (box[1] !== " " ? " checked" : "") + ">" + inline(box[2]) + "</li>";
          return "<li>" + inline(it) + "</li>";
        }).join("") + (ordered ? "</ol>" : "</ul>"));
        continue;
      }
      if (!line.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*```|\s*>|\s*([-*]|\d+\.)\s)/.test(lines[i]) &&
             !(/^\s*\|/.test(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))) para.push(lines[i++].trim());
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  // ------------------------------------------------------------------ header

  var t0 = DATA.tasks;
  el("crumb").innerHTML = '<span class="mono">' + esc(DATA.number) + "</span>" +
    (DATA.epic ? '<span class="chip mono">' + esc(DATA.epic) + "</span>" : "") +
    "<span>" + esc(DATA.feature) + "</span>";
  el("title").textContent = DATA.title.charAt(0).toUpperCase() + DATA.title.slice(1);
  document.title = DATA.number + " " + DATA.title + " · chopchop board";
  var repos = Array.from(new Set(t0.map(function (t) { return t.repo; }).filter(Boolean))).sort();
  var owners = Array.from(new Set(t0.map(function (t) { return t.owner; }).filter(Boolean))).sort();
  el("meta").innerHTML =
    '<span class="branch"><span class="chip mono">' + esc(DATA.base_branch || "base not set") + "</span>&larr;" +
    '<span class="chip mono">' + esc(DATA.feature_branch || "feature branch not created") + "</span></span>" +
    "<span>" + t0.length + " tasks</span><span>&middot;</span><span>" + repos.length + " repo" + (repos.length === 1 ? "" : "s") + "</span>";
  var counts = {};
  DATA.statuses.forEach(function (s) { counts[s.id] = t0.filter(function (t) { return t.status === s.id; }).length; });
  el("bar").innerHTML = DATA.statuses.map(function (s) {
    return t0.length ? '<span title="' + esc(s.title) + ": " + counts[s.id] + '" style="width:' + (100 * counts[s.id] / t0.length) +
      "%;background:" + COLORS[s.id] + '"></span>' : "";
  }).join("");
  el("pct").textContent = (counts.done || 0) + " of " + t0.length + " done";
  repos.forEach(function (r) { el("repo").insertAdjacentHTML("beforeend", '<option>' + esc(r) + "</option>"); });
  owners.forEach(function (o) { el("owner").insertAdjacentHTML("beforeend", '<option>' + esc(o) + "</option>"); });
  el("logBtn").textContent = "Changelog (" + DATA.changelog.length + ")";
  el("foot").textContent = "Generated by chopchop " + DATA.generated.replace("T", " ").slice(0, 16) +
    ". Statuses live in the task files. Change one with /chopchop:tasks --set <task> <status>.";

  // ------------------------------------------------------------------ board

  function matches(t) {
    var q = el("q").value.trim().toLowerCase();
    if (el("repo").value && t.repo !== el("repo").value) return false;
    if (el("owner").value && t.owner !== el("owner").value) return false;
    return !q || (t.id + " " + t.title + " " + (t.repo || "") + " " + (t.owner || "") + " " + t.body).toLowerCase().indexOf(q) >= 0;
  }

  function autoText(a) {
    if (a.state === "committed") return "Committed " + a.commit + " on " + a.branch + " · " + a.fixed + " fixed · " + a.parked + " parked" + (a.left ? " · " + a.left + " left" : "");
    if (a.state === "stopped" || a.state === "skipped") return a.state.charAt(0).toUpperCase() + a.state.slice(1) + ": " + (a.why || "");
    return a.state.charAt(0).toUpperCase() + a.state.slice(1) + (a.round ? ", review round " + a.round : "");
  }

  function card(t) {
    var badges = "";
    if (t.status === "todo" && t.waiting_on.length) badges += '<span class="badge wait">Waiting on ' + esc(t.waiting_on.join(", ")) + "</span>";
    if (t.changes.length) badges += '<span class="badge chg">' + t.changes.length + " change" + (t.changes.length === 1 ? "" : "s") + "</span>";
    if (t.pr) badges += '<span class="badge pr">PR</span>';
    if (t.auto && t.auto.state !== "queued") badges += '<span class="badge auto ' + esc(t.auto.state) + '">Auto: ' + esc(t.auto.state) + "</span>";
    return '<button type="button" class="card" data-id="' + esc(t.id) + '">' +
      '<div class="top"><span class="mono">' + esc(t.id) + "</span>" +
      (t.size ? '<span class="chip">' + esc(t.size) + "</span>" : "") +
      (t.wave != null ? '<span class="chip">Wave ' + esc(t.wave) + "</span>" : "") + "</div>" +
      '<div class="title">' + esc(t.title) + "</div>" +
      '<div class="bottom"><span class="chip mono">' + esc(t.repo || "?") + "</span>" + badges +
      '<span class="owner">' + avatar(t.owner) + "</span></div></button>";
  }

  function render() {
    el("board").innerHTML = DATA.statuses.map(function (s) {
      var list = t0.filter(function (t) { return t.status === s.id && matches(t); });
      return '<section class="col" aria-label="' + esc(s.title) + '"><h2><i style="background:' + COLORS[s.id] + '"></i>' +
        esc(s.title) + '<span class="n">' + list.length + "</span></h2>" +
        (list.length ? list.map(card).join("") : '<div class="empty">Nothing here</div>') + "</section>";
    }).join("");
  }

  // ------------------------------------------------------------------ dialogs

  var dlg = el("dlg");
  function openDialog(html) {
    dlg.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
  }
  function changeItem(c) {
    return '<li><div class="head"><b class="mono">' + esc(c.id) + "</b>" +
      (c.task ? '<span class="chip mono">' + esc(c.task) + "</span>" : "") +
      (c.date ? "<span>" + esc(c.date) + "</span>" : "") +
      (c.affects.length ? "<span>affects " + esc(c.affects.join(", ")) + "</span>" : "") +
      '</div><div class="text">' + esc(c.text) + "</div></li>";
  }

  function showTask(id) {
    var t = byId[id];
    if (!t) return;
    var deps = t.depends_on.length ? t.depends_on.map(function (d) {
      var dt = byId[d];
      return '<span class="chip mono" title="' + esc(dt ? dt.title : "") + '">' + esc(d) + (dt ? " &middot; " + esc(statusTitle[dt.status] || dt.status) : "") + "</span>";
    }).join("") : "None";
    var changes = DATA.changelog.filter(function (c) { return t.changes.indexOf(c.id) >= 0; });
    openDialog(
      '<div class="dlg-head"><div><div class="crumb"><span class="mono">' + esc(t.id) + "</span>" + pill(t.status) +
      '<span class="mono">' + esc(t.file) + '</span></div><h3 id="dlgTitle">' + esc(t.title) + "</h3></div>" +
      '<button class="close" type="button" aria-label="Close" data-close>&times;</button></div>' +
      '<div class="dlg-body"><div class="md">' + markdown(t.body) +
      (changes.length ? '<h2>Changes that affect this task</h2><ul class="log">' + changes.map(changeItem).join("") + "</ul>" : "") +
      '</div><dl class="facts">' +
      "<dt>Owner</dt><dd>" + avatar(t.owner) + " " + esc(t.owner || "Unassigned") + "</dd>" +
      '<dt>Repo</dt><dd><span class="chip mono">' + esc(t.repo || "?") + "</span></dd>" +
      "<dt>Wave &middot; Size</dt><dd>Wave " + esc(t.wave) + " &middot; " + esc(t.size || "?") + "</dd>" +
      "<dt>Depends on</dt><dd>" + deps + "</dd>" +
      (t.stories.length ? "<dt>Stories</dt><dd>" + t.stories.map(function (s) { return '<span class="chip mono">' + esc(s) + "</span>"; }).join("") + "</dd>" : "") +
      '<dt>Branch</dt><dd><span class="mono">' + esc(t.branch || "-") + "</span>" +
      (t.branch ? '<button class="copy" type="button" data-copy="' + esc(t.branch) + '">Copy</button>' : "") + "</dd>" +
      '<dt>PR into</dt><dd><span class="mono">' + esc(DATA.feature_branch || "feature branch not created") + "</span></dd>" +
      (t.pr ? '<dt>PR</dt><dd><a href="' + esc(t.pr) + '" target="_blank" rel="noopener">' + esc(t.pr) + "</a></dd>" : "") +
      (t.auto ? "<dt>Auto run</dt><dd>" + esc(autoText(t.auto)) + "</dd>" : "") +
      "</dl></div>");
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  }

  function showLog() {
    openDialog('<div class="dlg-head"><h3 id="dlgTitle">Changelog</h3>' +
      '<button class="close" type="button" aria-label="Close" data-close>&times;</button></div>' +
      '<div class="dlg-only">' + (DATA.changelog.length ? '<ul class="log">' + DATA.changelog.map(changeItem).join("") + "</ul>"
        : '<p class="empty">No changes yet.</p>') + "</div>");
  }

  el("board").addEventListener("click", function (e) {
    var c = e.target.closest(".card");
    if (c) showTask(c.getAttribute("data-id"));
  });
  dlg.addEventListener("click", function (e) {
    if (e.target === dlg || e.target.closest("[data-close]")) dlg.close();
    var cp = e.target.closest("[data-copy]");
    if (cp && navigator.clipboard) {
      navigator.clipboard.writeText(cp.getAttribute("data-copy")).then(function () { cp.textContent = "Copied"; }, function () {});
    }
  });
  dlg.addEventListener("close", function () {
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  });
  el("logBtn").addEventListener("click", showLog);
  ["q", "repo", "owner"].forEach(function (id) { el(id).addEventListener("input", render); });

  render();
  if (location.hash.length > 1) showTask(decodeURIComponent(location.hash.slice(1)));
})();
</script>
</body>
</html>
