<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chopchop feature</title>
<!--
  chopchop feature page. A fixed template: the design script copies it and puts the feature's
  data in the chopchop-feature script tag below. Edit design.md or the JSON files, then build
  again. Do not edit this file by hand.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
:root {
  --bg: #f3f6fb; --card: #ffffff; --ink: #0b1220; --muted: #556072;
  --line: #dde4ef; --line2: #c5d1e4;
  --blue: #1d4ed8; --navy: #1e3a8a; --soft: #eaf1ff; --soft-line: #bcd0fb; --code: #f1f5fb;
  --ok: #1d6a51; --ok-soft: #e2f4ea; --warn: #9a4b00; --warn-soft: #fff3e0; --bad: #b42318; --bad-soft: #fdecea;
  --deep: #0b1a3a;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --head: "Plus Jakarta Sans", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(15, 30, 60, 0.05), 0 8px 24px rgba(15, 30, 60, 0.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16.5px/1.65 var(--body); font-feature-settings: "cv11", "ss01"; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 96px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, h4 { font-family: var(--head); line-height: 1.2; margin: 0; text-wrap: balance; }
a { color: var(--blue); text-underline-offset: 2px; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--soft-line); outline-offset: 2px; }
code, pre, kbd { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* header */
.hero { background: linear-gradient(120deg, #1e3a8a, #2563eb); color: #fff; border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.01em; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; color: #dbe6ff; }
.pill { display: inline-block; font: 600 13px/1.4 var(--body); padding: 3px 12px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* stages */
.stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stage { min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; gap: 2px; }
.stage .k { font: 600 11.5px/1.3 var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stage b { font-weight: 600; font-size: 14.5px; }
.stage.ok { border-color: #a9d8bf; background: var(--ok-soft); }
.stage.ok .k { color: var(--ok); }
.stage.now { border-color: #f1c98b; background: var(--warn-soft); }
.stage.now .k { color: var(--warn); }
.stage.todo b { color: var(--muted); font-weight: 500; }

/* tabs */
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--line2); padding: 0 4px; }
nav.tabs button { border: none; background: none; color: var(--muted); padding: 10px 2px; cursor: pointer; font-weight: 600; font-size: 15.5px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--navy); }
nav.tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }

/* cards and document */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px; box-shadow: var(--shadow); min-width: 0; }
.doc { max-width: none; }
.doc > h1 { font-size: 28px; font-weight: 800; margin-bottom: 14px; color: var(--navy); }
.doc h2 { position: relative; font-size: 22px; font-weight: 700; margin: 34px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.doc h2::before { content: ""; position: absolute; left: 0; top: -2px; width: 44px; height: 3px; border-radius: 2px; background: var(--blue); }
.doc h3 { font-size: 18px; font-weight: 700; color: var(--navy); margin: 22px 0 8px; }
.doc p, .doc ul, .doc ol { margin: 0 0 12px; max-width: 76ch; }
.doc li { margin-bottom: 5px; }
.doc li::marker { color: var(--blue); font-weight: 600; }
.doc strong { font-weight: 600; }
.doc em { color: var(--muted); }
code { background: var(--soft); color: var(--navy); padding: 1px 6px; border-radius: 6px; font-size: 0.86em; }
pre { background: var(--code); border: 1px solid var(--line); padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: 14px; }
pre code { background: none; padding: 0; color: inherit; }
blockquote { margin: 0 0 12px; padding: 10px 16px; border-left: 3px solid var(--blue); background: var(--soft); border-radius: 0 10px 10px 0; }
.tbl { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line2); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--soft); color: var(--navy); font: 700 12px/1.4 var(--body); letter-spacing: 0.05em; text-transform: uppercase; }
tbody tr:nth-child(even) td { background: #f9fbfe; }
tbody tr:hover td { background: #f1f6ff; }
tr:last-child td { border-bottom: none; }
.box { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--blue); border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.box.on { background: var(--blue); }
button.cite { font: 500 12.5px/1.5 var(--mono); color: var(--navy); background: var(--soft); border: 1px solid var(--soft-line); border-radius: 6px; padding: 0 7px; cursor: pointer; }
button.cite:hover { border-color: var(--blue); }
button.cite.gone { color: var(--bad); background: var(--bad-soft); border-color: #f3b8b1; }
button.cite.changed { color: var(--warn); background: var(--warn-soft); border-color: #f1c98b; }

/* diagrams */
.diagram { position: relative; border: 1px solid var(--line); border-radius: 14px; background: #fcfdff; margin: 0 0 16px; }
.diagram { padding: 18px; overflow-x: auto; }
.diagram pre.mermaid { background: none; border: none; margin: 0; padding: 0; display: flex; justify-content: center; font-size: 14px; }
.diagram svg { max-width: none !important; height: auto; }
.zoombtn { position: absolute; top: 10px; right: 10px; z-index: 2; border: 1px solid var(--line2); background: #fff; color: var(--navy); border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.zoombtn:hover { border-color: var(--blue); color: var(--blue); }
.offline { font-size: 13px; color: var(--muted); margin-top: 6px; }
.diagram.drawn { padding: 18px 16px 12px; overflow-x: auto; }
.diagram.drawn svg { display: block; margin: 0 auto; }
svg .edge path { transition: opacity .15s; }
svg.focus .edge, svg.focus .node { opacity: 0.18; }
svg.focus .edge.on, svg.focus .node.on { opacity: 1; }
svg.focus .edge.on path.line { stroke: var(--blue); stroke-width: 3; }

/* lightbox */
#lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(11, 26, 58, 0.72); display: flex; flex-direction: column; padding: 18px; gap: 10px; }
#lightbox .lb-bar { display: flex; gap: 8px; justify-content: flex-end; }
#lightbox .lb-body { flex: 1; overflow: auto; background: #fff; border-radius: 14px; padding: 24px; }
#lightbox .lb-body svg { display: block; margin: 0 auto; max-width: none !important; }

/* buttons */
.btn { border: 1px solid var(--line2); background: #fff; color: var(--ink); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14.5px; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* citation panel */
#snip { position: fixed; right: 16px; bottom: 16px; width: min(600px, calc(100vw - 32px)); max-height: 62vh; overflow: auto; background: #fff; border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 18px 48px rgba(15, 30, 60, 0.22); z-index: 30; }
#snip .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--soft-line); font: 500 13px var(--mono); color: var(--navy); }
#snip pre { margin: 0; border: none; border-radius: 0; background: #fff; font-size: 13.5px; line-height: 1.6; }
#snip .ln { display: inline-block; min-width: 3.2em; color: var(--muted); user-select: none; }
#snip .note { padding: 10px 14px; font-size: 14px; border-top: 1px solid var(--line); }

/* slides and presenter view */
.present { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.deck { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stagebox { position: relative; width: 100%; overflow: hidden; border-radius: 14px; box-shadow: var(--shadow); background: #fff; }
.slide { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: #fff; color: var(--ink); padding: 52px 64px 44px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; }
.slide::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(90deg, #1e3a8a, #2563eb, #60a5fa); }
.slide .n { position: absolute; right: 40px; top: 26px; font: 500 16px var(--mono); color: var(--muted); display: flex; gap: 12px; }
.slide .n .tag { color: var(--warn); font-weight: 600; }
.slide h2 { font-size: 50px; font-weight: 800; color: var(--navy); letter-spacing: -0.015em; padding-right: 180px; }
.slide ul { margin: 0; padding-left: 34px; display: flex; flex-direction: column; gap: 16px; font-size: 29px; line-height: 1.38; }
.slide ul li::marker { color: var(--blue); }
.slide dl { margin: 0; display: flex; flex-direction: column; gap: 22px; }
.slide dt { font: 700 29px/1.3 var(--head); color: var(--navy); }
.slide dd { margin: 6px 0 0; font-size: 24px; color: #334155; }
.slide .ask { margin-top: auto; background: var(--soft); border: 2px solid var(--soft-line); color: var(--navy); border-radius: 14px; padding: 16px 22px; font-size: 26px; font-weight: 600; }
.slide .sd { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: #fcfdff; padding: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.slide .sd pre.mermaid { margin: 0; padding: 0; border: none; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: none; }
.slide .sd svg { width: 100% !important; height: 100% !important; max-width: none !important; min-width: 0 !important; }
.say { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
.say h3 { font-size: 13px; font-family: var(--body); font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--blue); }
.say ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; line-height: 1.5; }
.say ul li::marker { color: var(--blue); }
.say .next { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.say .next b { color: var(--ink); font-weight: 600; }
.say .clock { display: flex; justify-content: space-between; align-items: center; font: 600 15px var(--mono); color: var(--navy); }
.say ol.list { margin: 0; padding-left: 26px; font-size: 14px; max-height: 260px; overflow: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.say ol.list li { cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.say ol.list li:hover { background: var(--soft); }
.say ol.list li.on { color: var(--blue); font-weight: 600; }
.deck.presenting { position: fixed; inset: 0; z-index: 35; background: var(--deep); gap: 0; }
.deck.presenting .stagebox { flex: 1; box-shadow: none; background: transparent; border-radius: 0; }
.deck.presenting .bar { position: fixed; left: 14px; bottom: 12px; opacity: 0.22; z-index: 36; }
.deck.presenting .bar:hover { opacity: 1; }
.deck .fsnotes { display: none; }
.deck.presenting.shownotes .fsnotes { display: block; position: fixed; left: 50%; transform: translateX(-50%); bottom: 58px; width: min(980px, 92vw); max-height: 30vh; overflow: auto; background: rgba(255, 255, 255, 0.96); border-radius: 12px; padding: 12px 18px; font-size: 16px; z-index: 36; }
.print-slides { display: none; }

/* send */
.send { display: flex; flex-direction: column; gap: 16px; }
.send h2 { font-size: 22px; }
.send h3 { font-size: 17px; color: var(--navy); }
.send textarea { width: 100%; min-height: 230px; font: 14px/1.6 var(--mono); background: var(--code); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; }
.list { margin: 0; padding-left: 22px; }
.list li::marker { color: var(--blue); }
.blocks li { color: var(--bad); }

@media (max-width: 900px) {
  .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .present { grid-template-columns: 1fr; }
  .say { position: static; }
  .panel { padding: 20px 18px; }
}
@media (max-width: 520px) {
  .stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 20px; }
  body { font-size: 16px; }
}
@media print {
  body { background: #fff; }
  .hero { background: none; color: #000; box-shadow: none; padding: 0; }
  .hero .meta { color: #333; }
  nav.tabs, .bar, #snip, .stages, .say, .zoombtn { display: none !important; }
  .panel, .stage, .stagebox { box-shadow: none; }
  .panel { border: none; padding: 0; }
  .print-slides { display: block; }
  .print-slides .slide { position: relative; transform: none; zoom: 0.75; break-after: page; margin: 0 auto; }
  .deck .stagebox { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="meta"><span id="fnum"></span><span class="pill" id="status"></span><span id="gen"></span></div>
    <h1 id="title">Feature</h1>
  </header>
  <div class="stages" id="stages" aria-label="Where the feature stands"></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="t-design" aria-controls="p-design" aria-selected="true">Design</button>
    <button role="tab" id="t-choices" aria-controls="p-choices" aria-selected="false">Choices</button>
    <button role="tab" id="t-slides" aria-controls="p-slides" aria-selected="false">Present</button>
    <button role="tab" id="t-send" aria-controls="p-send" aria-selected="false">Send for review</button>
  </nav>
  <section class="panel doc" id="p-design" role="tabpanel" aria-labelledby="t-design"></section>
  <section class="panel doc" id="p-choices" role="tabpanel" aria-labelledby="t-choices" hidden></section>
  <section id="p-slides" role="tabpanel" aria-labelledby="t-slides" hidden>
    <div class="present">
      <div class="deck" id="deck">
        <div class="stagebox" id="stagebox"><div class="slide live" id="slide" aria-live="polite"></div></div>
        <div class="bar">
          <button class="btn" type="button" id="prev">← Back</button>
          <button class="btn primary" type="button" id="next">Next →</button>
          <button class="btn" type="button" id="full">Present full screen</button>
          <button class="btn" type="button" id="speaker">Open speaker window</button>
          <span class="muted small">Arrows move · F full screen · N notes in full screen · Esc leaves</span>
        </div>
        <div class="fsnotes" id="fsnotes"></div>
      </div>
      <aside class="say" aria-label="What to say">
        <div class="clock"><span id="clock">00:00</span><button class="btn" type="button" id="clockreset">Restart timer</button></div>
        <h3>What to say</h3>
        <ul id="saylist"></ul>
        <div class="next" id="nextup"></div>
        <ol class="list" id="slidelist"></ol>
      </aside>
    </div>
    <div class="print-slides" id="printslides"></div>
  </section>
  <section class="panel send" id="p-send" role="tabpanel" aria-labelledby="t-send" hidden></section>
</div>
<div id="snip" hidden></div>
<div id="lightbox" hidden><div class="lb-bar"><button class="btn" type="button" id="lb-out">Smaller</button><button class="btn" type="button" id="lb-in">Bigger</button><button class="btn primary" type="button" id="lb-close">Close</button></div><div class="lb-body" id="lb-body"></div></div>

<script id="chopchop-feature" type="application/json">/*__CHOPCHOP_FEATURE__*/null</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  var raw = document.getElementById("chopchop-feature").textContent.trim();
  var D = raw && raw.charAt(0) === "{" ? JSON.parse(raw) : null;
  if (!D) { document.getElementById("p-design").innerHTML = "<p>No data. Build the design first.</p>"; return; }
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function sv(tag, attrs, parent) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  // ---------------------------------------------------------------- mermaid, themed, after the fonts load
  var hasMermaid = typeof window.mermaid !== "undefined";
  if (hasMermaid) {
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: "basis", padding: 14 },
      sequence: { useMaxWidth: false, actorMargin: 70, boxMargin: 12, messageFontSize: 15, actorFontSize: 15, noteFontSize: 14, mirrorActors: false },
      themeVariables: {
        fontFamily: "Inter, Segoe UI, system-ui, sans-serif", fontSize: "16px",
        primaryColor: "#eef4ff", primaryBorderColor: "#3b6fe0", primaryTextColor: "#0b1220",
        secondaryColor: "#f7f9fd", tertiaryColor: "#ffffff", lineColor: "#64748b",
        clusterBkg: "#f7f9fd", clusterBorder: "#c5d1e4",
        actorBkg: "#eef4ff", actorBorder: "#3b6fe0", actorTextColor: "#0b1220", actorLineColor: "#94a3b8",
        signalColor: "#334155", signalTextColor: "#0b1220", labelBoxBkgColor: "#eef4ff", labelBoxBorderColor: "#3b6fe0",
        labelTextColor: "#1e3a8a", loopTextColor: "#1e3a8a", noteBkgColor: "#fff8e6", noteBorderColor: "#e9c46a",
        noteTextColor: "#0b1220", activationBkgColor: "#dbe7ff", activationBorderColor: "#3b6fe0"
      }
    });
  }
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  function draw(root) {
    var pres = Array.prototype.slice.call(root.querySelectorAll("pre.mermaid:not([data-done])"));
    if (!pres.length) return Promise.resolve();
    pres.forEach(function (p) { p.setAttribute("data-done", "1"); });
    if (!hasMermaid) {
      pres.forEach(function (p) { p.parentNode.appendChild(el("div", "offline", "This diagram needs the internet to draw. Its source is shown.")); });
      return Promise.resolve();
    }
    return fontsReady.then(function () { return window.mermaid.run({ nodes: pres }); }).catch(function () {
      pres.forEach(function (p) { if (!p.querySelector("svg")) p.parentNode.appendChild(el("div", "offline", "This diagram could not be drawn. Its source is shown.")); });
    }).then(function () { pres.forEach(function (p) { addZoom(p.closest(".diagram")); }); });
  }

  // ---------------------------------------------------------------- zoom any diagram
  var lb = document.getElementById("lightbox"), lbBody = document.getElementById("lb-body"), lbScale = 1, lbSvg = null, lbBase = 0;
  function lbApply() { if (lbSvg) { lbSvg.style.width = Math.round(lbBase * lbScale) + "px"; lbSvg.style.height = "auto"; } }
  function openZoom(svg) {
    lbBody.innerHTML = "";
    lbSvg = svg.cloneNode(true);
    lbSvg.removeAttribute("height");
    var vb = (svg.getAttribute("viewBox") || "").split(/\s+/);
    lbBase = vb.length === 4 ? parseFloat(vb[2]) : svg.getBoundingClientRect().width;
    lbScale = Math.max(1, Math.min(2, (window.innerWidth - 90) / lbBase));
    lbBody.appendChild(lbSvg); lbApply(); lb.hidden = false;
  }
  document.getElementById("lb-in").onclick = function () { lbScale = Math.min(4, lbScale * 1.25); lbApply(); };
  document.getElementById("lb-out").onclick = function () { lbScale = Math.max(0.4, lbScale / 1.25); lbApply(); };
  document.getElementById("lb-close").onclick = function () { lb.hidden = true; };
  lb.addEventListener("click", function (e) { if (e.target === lb) lb.hidden = true; });
  function addZoom(box) {
    if (!box || box.querySelector(".zoombtn")) return;
    var b = el("button", "zoombtn", "Zoom"); b.type = "button";
    b.onclick = function () { var s = box.querySelector("svg"); if (s) openZoom(s); };
    box.appendChild(b);
  }

  // ---------------------------------------------------------------- header and stages
  var f = D.feature;
  document.title = f.title + " · chopchop";
  document.getElementById("title").textContent = f.title;
  document.getElementById("fnum").textContent = f.number + (f.epic ? " · " + f.epic : "");
  var st = document.getElementById("status");
  st.textContent = D.design.status_text + (D.report && !D.report.ready ? " Not ready for review." : "");
  st.className = "pill" + (D.design.status.indexOf("approved") === 0 ? " ok" : (D.report && !D.report.ready ? " bad" : ""));
  document.getElementById("gen").textContent = "Built " + D.generated.replace("T", " ").slice(0, 16);
  var stages = document.getElementById("stages");
  D.stages.forEach(function (s) { var d = el("div", "stage " + s.state); d.appendChild(el("span", "k", s.label)); d.appendChild(el("b", null, s.text)); stages.appendChild(d); });

  // ---------------------------------------------------------------- design and choices
  var pd = document.getElementById("p-design"), pc = document.getElementById("p-choices");
  pd.innerHTML = D.design.html;
  pc.innerHTML = D.options_html || "<p class=\"muted\">No choices file yet.</p>";
  [pd, pc].forEach(function (root) { root.querySelectorAll(".diagram.drawn").forEach(addZoom); });

  // ---------------------------------------------------------------- citations
  var snip = document.getElementById("snip");
  [pd, pc].forEach(function (root) {
    root.querySelectorAll("button.cite").forEach(function (b) { var c = D.cites[b.getAttribute("data-cite")]; if (c && (c.status === "gone" || c.status === "changed")) b.classList.add(c.status); });
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.cite") : null;
    if (!b) return;
    var c = D.cites[b.getAttribute("data-cite")];
    snip.innerHTML = "";
    var h = el("div", "sh"); h.appendChild(el("span", null, c ? c.path : b.getAttribute("data-cite")));
    h.appendChild(el("span", "pill" + (c && c.status === "gone" ? " bad" : (c && c.status === "fresh" ? " ok" : "")), c ? c.status : "not checked"));
    var close = el("button", "btn", "Close"); close.type = "button"; close.onclick = function () { snip.hidden = true; }; h.appendChild(close);
    snip.appendChild(h);
    if (c && c.lines.length) {
      var pre = el("pre");
      c.lines.forEach(function (row) { var line = el("div"); line.appendChild(el("span", "ln", String(row[0]))); line.appendChild(document.createTextNode(row[1])); pre.appendChild(line); });
      snip.appendChild(pre);
    }
    var note = (c && c.note) || (c && c.status === "fresh" ? "Same at the latest commit." : "");
    if (c && c.masked) note += " Something that looks like a secret was masked.";
    if (c && c.cut) note += " Only the first lines are shown.";
    if (note) snip.appendChild(el("div", "note", note.trim()));
    snip.hidden = false;
  });

  // ---------------------------------------------------------------- slides
  var slides = D.slides || [], i = 0, timerStart = null;
  var slideEl = document.getElementById("slide"), stagebox = document.getElementById("stagebox"), deck = document.getElementById("deck");
  var sayEl = document.getElementById("saylist"), nextEl = document.getElementById("nextup"), listEl = document.getElementById("slidelist"), fsnotes = document.getElementById("fsnotes");
  var speakerWin = null;
  function fill(box, s, k) {
    box.innerHTML = "";
    var n = el("span", "n", (k + 1) + " / " + slides.length); if (s.backup) n.insertBefore(el("span", "tag", "Backup"), n.firstChild);
    box.appendChild(n);
    box.appendChild(el("h2", null, s.title));
    if (s.svg) { var sd = el("div", "sd"); sd.innerHTML = s.svg; box.appendChild(sd); }
    if (s.bullets.length) { var ul = el("ul"); s.bullets.forEach(function (b) { ul.appendChild(el("li", null, b)); }); box.appendChild(ul); }
    if (s.qa && s.qa.length) { var dl = el("dl"); s.qa.forEach(function (p) { dl.appendChild(el("dt", null, p[0])); dl.appendChild(el("dd", null, p[1])); }); box.appendChild(dl); }
    if (s.ask) box.appendChild(el("div", "ask", s.ask));
  }
  function fit() {
    var presenting = deck.classList.contains("presenting"), w = stagebox.clientWidth;
    var h = presenting ? window.innerHeight : Math.round(w * 9 / 16);
    stagebox.style.height = presenting ? "" : h + "px";
    var k = Math.min(w / 1280, h / 720), x = Math.max(0, (w - 1280 * k) / 2), y = Math.max(0, (h - 720 * k) / 2);
    slideEl.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")";
  }
  function sayLines(s) { return (s.say && s.say.length) ? s.say : ["No notes for this slide. Add a talk comment to its section in design.md."]; }
  function renderSay(target, s) {
    target.innerHTML = "";
    sayLines(s).forEach(function (t) { target.appendChild(el("li", null, t)); });
  }
  function show() {
    if (!slides.length) { slideEl.textContent = "No slides yet."; return; }
    var s = slides[i];
    fill(slideEl, s, i);
    renderSay(sayEl, s);
    nextEl.innerHTML = "";
    var nx = slides[i + 1]; nextEl.appendChild(document.createTextNode("Next: ")); nextEl.appendChild(el("b", null, nx ? nx.title : "End of the deck"));
    fsnotes.innerHTML = ""; var fl = el("ul"); sayLines(s).forEach(function (t) { fl.appendChild(el("li", null, t)); }); fsnotes.appendChild(fl);
    Array.prototype.forEach.call(listEl.children, function (li, k) { li.classList.toggle("on", k === i); });
    fit();
    draw(slideEl);
    if (speakerWin && !speakerWin.closed) renderSpeaker();
  }
  slides.forEach(function (s, k) { var li = el("li", null, s.title); li.onclick = function () { i = k; show(); }; listEl.appendChild(li); });
  function go(d) {
    if (!slides.length) return;
    var j = i + d; if (j < 0 || j >= slides.length) return;
    i = j; show();
  }
  document.getElementById("prev").onclick = function () { go(-1); };
  document.getElementById("next").onclick = function () { go(1); };
  function present(on) { deck.classList.toggle("presenting", on); if (!on) deck.classList.remove("shownotes"); document.getElementById("full").textContent = on ? "Leave full screen" : "Present full screen"; fit(); }
  function full() {
    if (deck.classList.contains("presenting")) { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); present(false); return; }
    startClock(); present(true); if (deck.requestFullscreen) deck.requestFullscreen().catch(function () {});
  }
  document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement) present(false); else fit(); });
  document.getElementById("full").onclick = full;
  window.addEventListener("resize", function () { if (!document.getElementById("p-slides").hidden) fit(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { snip.hidden = true; lb.hidden = true; if (deck.classList.contains("presenting") && !document.fullscreenElement) present(false); }
    if (document.getElementById("p-slides").hidden || /INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === "f" || e.key === "F") full();
    else if (e.key === "n" || e.key === "N") deck.classList.toggle("shownotes");
  });

  // timer
  var clock = document.getElementById("clock");
  function startClock() { if (!timerStart) timerStart = Date.now(); }
  function tick() {
    var t = timerStart ? Math.floor((Date.now() - timerStart) / 1000) : 0;
    var txt = ("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + t % 60).slice(-2);
    clock.textContent = txt;
    if (speakerWin && !speakerWin.closed) { var c = speakerWin.document.getElementById("sw-clock"); if (c) c.textContent = txt; }
  }
  setInterval(tick, 1000);
  document.getElementById("clockreset").onclick = function () { timerStart = Date.now(); tick(); };

  // speaker window: notes, next slide and timer on the presenter's own screen
  function renderSpeaker() {
    var d = speakerWin.document, s = slides[i], nx = slides[i + 1];
    d.getElementById("sw-title").textContent = (i + 1) + " / " + slides.length + " · " + s.title;
    var ul = d.getElementById("sw-say"); ul.innerHTML = "";
    sayLines(s).forEach(function (t) { var li = d.createElement("li"); li.textContent = t; ul.appendChild(li); });
    d.getElementById("sw-next").textContent = nx ? "Next: " + nx.title : "End of the deck";
  }
  document.getElementById("speaker").onclick = function () {
    speakerWin = window.open("", "chopchop-speaker", "width=560,height=760");
    if (!speakerWin) { alert("The browser blocked the speaker window. Allow pop-ups for this page."); return; }
    var d = speakerWin.document;
    d.open();
    d.write('<!doctype html><title>Speaker notes</title><style>body{margin:0;font:16px/1.55 Inter,Segoe UI,system-ui,sans-serif;color:#0b1220;background:#f3f6fb}' +
      'header{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;padding:16px 20px}h1{font:700 19px/1.3 "Plus Jakarta Sans",Inter,sans-serif;margin:0}' +
      '#sw-clock{font:600 26px ui-monospace,Menlo,monospace;margin-top:6px}main{padding:16px 20px}' +
      'h2{font:700 12px Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#1d4ed8;margin:8px 0}ul{padding-left:20px;margin:0}li{margin-bottom:8px}li::marker{color:#1d4ed8}' +
      '#sw-next{color:#556072;border-top:1px solid #dde4ef;margin-top:14px;padding-top:10px}.bar{display:flex;gap:8px;padding:0 20px 20px}button{font:600 15px Inter,sans-serif;padding:9px 16px;border-radius:10px;border:1px solid #c5d1e4;background:#fff;cursor:pointer}' +
      'button.p{background:#1d4ed8;border-color:#1d4ed8;color:#fff}</style><header><h1 id="sw-title"></h1><div id="sw-clock">00:00</div></header>' +
      '<main><h2>What to say</h2><ul id="sw-say"></ul><div id="sw-next"></div></main><div class="bar"><button id="sw-prev">← Back</button><button class="p" id="sw-nextbtn">Next →</button></div>');
    d.close();
    d.getElementById("sw-prev").onclick = function () { go(-1); };
    d.getElementById("sw-nextbtn").onclick = function () { go(1); };
    d.addEventListener("keydown", function (e) { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); } else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } });
    startClock(); renderSpeaker(); tick();
  };
  window.addEventListener("beforeprint", function () {
    var all = document.getElementById("printslides");
    if (all.childNodes.length) return;
    slides.forEach(function (s, k) { var box = el("div", "slide"); fill(box, s, k, 0); all.appendChild(box); });
  });

  // ---------------------------------------------------------------- send for review
  var ps = document.getElementById("p-send");
  ps.appendChild(el("h2", null, "Send for review"));
  ps.appendChild(el("p", "muted", "Paste this into chat, email or a ticket, and attach this page. It names no tool."));
  var ta = el("textarea"); ta.id = "message"; ta.value = D.message; ta.setAttribute("aria-label", "Review message"); ps.appendChild(ta);
  var row = el("div", "bar"); var copy = el("button", "btn primary", "Copy the message"); copy.type = "button"; var done = el("span", "muted small");
  copy.onclick = function () {
    var ok = function () { done.textContent = "Copied."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, function () { ta.select(); done.textContent = "Selected. Press Ctrl+C or Cmd+C."; });
    else { ta.select(); done.textContent = "Selected. Press Ctrl+C or Cmd+C."; }
  };
  row.appendChild(copy); row.appendChild(done); ps.appendChild(row);
  ps.appendChild(el("h3", null, "Who must approve"));
  var ul = el("ul", "list");
  (D.approvers.length ? D.approvers : [{ who: "Not known yet", why: "the high-level design has no new or changed repo" }]).forEach(function (a) { ul.appendChild(el("li", null, a.who + " (" + a.why + ")")); });
  ps.appendChild(ul);
  if (D.report) {
    ps.appendChild(el("h3", null, D.report.ready ? "Ready for review" : "Not ready yet"));
    if (D.report.errors.length) { var bl = el("ul", "list blocks"); D.report.errors.forEach(function (x) { bl.appendChild(el("li", null, x)); }); ps.appendChild(bl); }
    else ps.appendChild(el("p", "small", "Nothing blocks the approval request."));
    if (D.report.warnings.length) {
      var det = el("details"); det.appendChild(el("summary", null, D.report.warnings.length + " warning(s)"));
      var wl = el("ul", "list small"); D.report.warnings.forEach(function (x) { wl.appendChild(el("li", null, x)); }); det.appendChild(wl); ps.appendChild(det);
    }
  }

  // ---------------------------------------------------------------- tabs
  var tabs = Array.prototype.slice.call(document.querySelectorAll("nav.tabs button"));
  function open(t) {
    tabs.forEach(function (o) { var on = o === t; o.setAttribute("aria-selected", on ? "true" : "false"); document.getElementById(o.getAttribute("aria-controls")).hidden = !on; });
    if (t.id === "t-slides") show(); else draw(document.getElementById(t.getAttribute("aria-controls")));
    try { history.replaceState(null, "", "#" + t.id.slice(2)); } catch (e) {}
  }
  tabs.forEach(function (t) { t.onclick = function () { open(t); }; });
  open(document.getElementById("t-" + (location.hash || "#design").slice(1)) || tabs[0]);
})();
</script>
</body>
</html>
