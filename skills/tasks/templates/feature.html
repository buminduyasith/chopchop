<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chopchop feature</title>
<!--
  chopchop feature page. A fixed template: the design script copies it and puts the feature's
  data in the chopchop-feature script tag below. Edit design.md or the JSON files, then build
  again. Do not edit this file by hand.
-->
<style>
:root {
  --bg: #f5f7f3; --surface: #ffffff; --ink: #1b2620; --muted: #5a675f; --line: #d6ddd6;
  --accent: #1d6a51; --accent-soft: #e2efe8; --warn: #8f5500; --warn-soft: #f9eedb;
  --bad: #a3322b; --bad-soft: #f8e4e2; --code: #edf1ec; --slide: #14201a; --slide-ink: #eef4f0;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101513; --surface: #161d19; --ink: #e2e9e4; --muted: #9aa79f; --line: #29332d;
    --accent: #64c49d; --accent-soft: #19291f; --warn: #e2a64e; --warn-soft: #2a2215;
    --bad: #f08a80; --bad-soft: #301a18; --code: #1b231f; --slide: #0b120e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; }
code, pre { font-family: var(--mono); font-size: 0.88em; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.pill { display: inline-block; font-size: 0.8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
header { display: flex; flex-direction: column; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { flex: 1 1 120px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; }
.stage .k { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.stage b { font-size: 0.88rem; }
.stage.ok { border-color: var(--accent); background: var(--accent-soft); }
.stage.now { border-color: var(--warn); background: var(--warn-soft); }
.stage.todo { opacity: 0.6; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
nav.tabs button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 14px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; min-width: 0; }
.doc h1 { font-size: 1.6rem; margin-bottom: 8px; }
.doc h2 { font-size: 1.25rem; margin: 28px 0 10px; padding-top: 14px; border-top: 2px dashed var(--line); }
.doc h3 { font-size: 1.05rem; margin: 18px 0 8px; }
.doc p, .doc ul, .doc ol { margin: 0 0 10px; max-width: 72ch; }
.doc li { margin-bottom: 4px; }
.tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--code); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
tr:last-child td { border-bottom: none; }
blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 12px; overflow-x: auto; }
.diagram pre.mermaid { background: none; margin: 0; padding: 0; display: flex; justify-content: center; }
.diagram svg { max-width: 100%; height: auto; }
.offline { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
button.cite { font: 0.78rem/1.4 var(--mono); color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 4px; padding: 0 6px; cursor: pointer; }
button.cite.gone { color: var(--bad); background: var(--bad-soft); }
button.cite.changed { color: var(--warn); background: var(--warn-soft); }
button.cite:hover { border-color: currentColor; }
.box { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.box.on { background: var(--accent); }
#snip { position: fixed; right: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); z-index: 10; }
#snip header { flex-direction: row; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--code); border-bottom: 1px solid var(--line); font: 0.8rem var(--mono); gap: 8px; }
#snip pre { margin: 0; border-radius: 0; background: none; }
#snip .ln { display: inline-block; min-width: 3em; color: var(--muted); user-select: none; }
#snip .note { padding: 8px 12px; font-size: 0.86rem; border-top: 1px solid var(--line); }
#snip button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; }
.deck { display: flex; flex-direction: column; gap: 10px; }
.slide { background: var(--slide); color: var(--slide-ink); border-radius: 10px; aspect-ratio: 16 / 9; width: 100%; padding: clamp(16px, 4vw, 44px); display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.slide .n { font: 0.78rem var(--mono); opacity: 0.7; }
.slide h2 { font-size: clamp(1.3rem, 3.4vw, 2.3rem); }
.slide ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: clamp(0.9rem, 2.1vw, 1.25rem); }
.slide .ask { margin-top: auto; border: 1.5px solid #64c49d; color: #9fe0c3; border-radius: 8px; padding: 8px 14px; font-size: clamp(0.85rem, 2vw, 1.15rem); }
.slide .sd { background: #f5f7f3; color: #1b2620; border-radius: 8px; padding: 8px; flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; }
.slide .sd svg { max-height: 100%; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar button, .send button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.bar button:hover, .send button:hover { border-color: var(--accent); color: var(--accent); }
.notes { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 0.92rem; }
.deck:fullscreen { background: #000; padding: 2vh 2vw; justify-content: center; }
.deck:fullscreen .slide { max-height: 86vh; width: auto; margin: 0 auto; }
.deck:fullscreen .notes { display: none; }
.send { display: flex; flex-direction: column; gap: 14px; }
.send textarea { width: 100%; min-height: 220px; font: 0.88rem/1.5 var(--mono); background: var(--code); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.list { margin: 0; padding-left: 20px; }
.blocks li { color: var(--bad); }
.print-slides { display: none; }
@media print {
  nav.tabs, .bar, #snip, .stages { display: none !important; }
  body { background: #fff; }
  .panel { border: none; padding: 0; }
  .print-slides { display: block; }
  .print-slides .slide { break-after: page; margin-bottom: 0; }
  .deck .slide.live, .deck .notes { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="meta"><span class="muted small" id="fnum"></span><span class="pill" id="status"></span><span class="muted small" id="gen"></span></div>
    <h1 id="title">Feature</h1>
  </header>
  <div class="stages" id="stages" aria-label="Where the feature stands"></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="t-design" aria-controls="p-design" aria-selected="true">Design</button>
    <button role="tab" id="t-choices" aria-controls="p-choices" aria-selected="false">Choices</button>
    <button role="tab" id="t-slides" aria-controls="p-slides" aria-selected="false">Slides</button>
    <button role="tab" id="t-send" aria-controls="p-send" aria-selected="false">Send for review</button>
  </nav>
  <section class="panel doc" id="p-design" role="tabpanel" aria-labelledby="t-design"></section>
  <section class="panel doc" id="p-choices" role="tabpanel" aria-labelledby="t-choices" hidden></section>
  <section class="panel" id="p-slides" role="tabpanel" aria-labelledby="t-slides" hidden>
    <div class="deck" id="deck">
      <div class="slide live" id="slide" aria-live="polite"></div>
      <div class="bar">
        <button type="button" id="prev">← Back</button>
        <button type="button" id="next">Next →</button>
        <button type="button" id="full">Present full screen</button>
        <button type="button" id="notesbtn" aria-pressed="true">Hide notes</button>
        <span class="muted small">Keys: arrows move, N notes, F full screen. Print makes one slide per page.</span>
      </div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="print-slides" id="printslides"></div>
  </section>
  <section class="panel send" id="p-send" role="tabpanel" aria-labelledby="t-send" hidden></section>
</div>
<div id="snip" hidden></div>

<script id="chopchop-feature" type="application/json">/*__CHOPCHOP_FEATURE__*/null</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  var raw = document.getElementById("chopchop-feature").textContent.trim();
  var D = raw && raw.charAt(0) === "{" ? JSON.parse(raw) : null;
  if (!D) { document.getElementById("p-design").innerHTML = "<p>No data. Build the design first.</p>"; return; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var hasMermaid = typeof window.mermaid !== "undefined";
  if (hasMermaid) { window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" }); }

  function draw(root, light) {
    var pres = Array.prototype.slice.call(root.querySelectorAll("pre.mermaid:not([data-done])"));
    pres.forEach(function (p) {
      p.setAttribute("data-done", "1");
      if (!hasMermaid) {
        var note = el("div", "offline", "This diagram needs the internet to draw. The numbered steps say the same thing.");
        p.parentNode.appendChild(note);
        return;
      }
      if (light) { window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" }); }
      window.mermaid.run({ nodes: [p] }).catch(function () {
        p.parentNode.appendChild(el("div", "offline", "This diagram could not be drawn. Its source is shown."));
      }).then(function () {
        if (light) { window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" }); }
      });
    });
  }

  // header and stages
  var f = D.feature;
  document.title = f.title + " · chopchop";
  document.getElementById("title").textContent = f.title;
  document.getElementById("fnum").textContent = f.number + (f.epic ? " · " + f.epic : "") + " · " + f.name;
  var st = document.getElementById("status");
  st.textContent = D.design.status_text + (D.report && !D.report.ready ? " Not ready for review." : "");
  st.className = "pill" + (D.design.status.indexOf("approved") === 0 ? " ok" : (D.report && !D.report.ready ? " bad" : ""));
  document.getElementById("gen").textContent = "Built " + D.generated.replace("T", " ").slice(0, 16);
  var stages = document.getElementById("stages");
  D.stages.forEach(function (s) {
    var d = el("div", "stage " + s.state); d.appendChild(el("span", "k", s.label)); d.appendChild(el("b", null, s.text)); stages.appendChild(d);
  });

  // design and choices
  var pd = document.getElementById("p-design"), pc = document.getElementById("p-choices");
  pd.innerHTML = D.design.html;
  pc.innerHTML = D.options_html || "<p class=\"muted\">No choices file yet.</p>";

  // citations
  var snip = document.getElementById("snip");
  function decorate(root) {
    root.querySelectorAll("button.cite").forEach(function (b) {
      var c = D.cites[b.getAttribute("data-cite")];
      if (c && (c.status === "gone" || c.status === "changed")) b.classList.add(c.status);
    });
  }
  decorate(pd); decorate(pc);
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button.cite") : null;
    if (!b) return;
    var c = D.cites[b.getAttribute("data-cite")];
    snip.innerHTML = "";
    var h = document.createElement("header");
    h.appendChild(el("span", null, c ? c.path : b.getAttribute("data-cite")));
    h.appendChild(el("span", "pill" + (c && c.status === "gone" ? " bad" : (c && c.status === "fresh" ? " ok" : "")), c ? c.status : "not checked"));
    var close = el("button", null, "Close"); close.type = "button"; close.onclick = function () { snip.hidden = true; };
    h.appendChild(close);
    snip.appendChild(h);
    if (c && c.lines.length) {
      var pre = el("pre");
      c.lines.forEach(function (row) { var line = el("div"); line.appendChild(el("span", "ln", String(row[0]))); line.appendChild(document.createTextNode(row[1])); pre.appendChild(line); });
      snip.appendChild(pre);
    }
    var note = (c && c.note) || (c && c.status === "fresh" ? "Same at the latest commit." : "");
    if (c && c.masked) note += " Something that looks like a secret was masked.";
    if (c && c.cut) note += " Only the first lines are shown.";
    if (note) snip.appendChild(el("div", "note", note.trim()));
    snip.hidden = false;
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") snip.hidden = true; });

  // slides
  var i = 0, slides = D.slides || [], showNotes = true;
  var slideEl = document.getElementById("slide"), notesEl = document.getElementById("notes");
  function fill(box, s, k) {
    box.innerHTML = "";
    box.appendChild(el("span", "n", "Slide " + (k + 1) + " of " + slides.length));
    box.appendChild(el("h2", null, s.title));
    if (s.diagram) {
      var sd = el("div", "sd"); var pre = el("pre", "mermaid"); pre.textContent = s.diagram; sd.appendChild(pre); box.appendChild(sd);
    }
    if (s.bullets.length) {
      var ul = el("ul"); s.bullets.forEach(function (b) { ul.appendChild(el("li", null, b)); }); box.appendChild(ul);
    }
    if (s.ask) box.appendChild(el("div", "ask", s.ask));
  }
  function show() {
    if (!slides.length) { slideEl.textContent = "No slides yet."; return; }
    fill(slideEl, slides[i], i);
    notesEl.textContent = slides[i].notes || "No notes for this slide.";
    notesEl.hidden = !showNotes;
    draw(slideEl, true);
  }
  function go(step) { if (!slides.length) return; i = (i + step + slides.length) % slides.length; show(); }
  document.getElementById("prev").onclick = function () { go(-1); };
  document.getElementById("next").onclick = function () { go(1); };
  var nb = document.getElementById("notesbtn");
  function toggleNotes() { showNotes = !showNotes; nb.setAttribute("aria-pressed", showNotes ? "true" : "false"); nb.textContent = showNotes ? "Hide notes" : "Show notes"; notesEl.hidden = !showNotes; }
  nb.onclick = toggleNotes;
  var deck = document.getElementById("deck");
  function full() { if (deck.requestFullscreen) deck.requestFullscreen().catch(function () {}); }
  document.getElementById("full").onclick = full;
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("p-slides").hidden || /INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === "n" || e.key === "N") toggleNotes();
    else if (e.key === "f" || e.key === "F") full();
  });
  window.addEventListener("beforeprint", function () {
    var all = document.getElementById("printslides");
    if (all.childNodes.length) return;
    slides.forEach(function (s, k) { var box = el("div", "slide"); fill(box, s, k); all.appendChild(box); });
  });

  // send for review
  var ps = document.getElementById("p-send");
  ps.appendChild(el("h2", null, "Send for review"));
  ps.appendChild(el("p", "muted small", "Paste this into chat, email or a ticket, and attach this page. It names no tool."));
  var ta = el("textarea"); ta.id = "message"; ta.value = D.message; ta.setAttribute("aria-label", "Review message"); ps.appendChild(ta);
  var row = el("div", "bar"); var copy = el("button", null, "Copy the message"); copy.type = "button";
  var done = el("span", "muted small");
  copy.onclick = function () {
    var ok = function () { done.textContent = "Copied."; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(ok, function () { ta.select(); done.textContent = "Selected. Press Ctrl+C or Cmd+C."; });
    } else { ta.select(); done.textContent = "Selected. Press Ctrl+C or Cmd+C."; }
  };
  row.appendChild(copy); row.appendChild(done); ps.appendChild(row);
  ps.appendChild(el("h3", null, "Who must approve"));
  var ul = el("ul", "list");
  (D.approvers.length ? D.approvers : [{ who: "Not known yet", why: "the feature map has no new or changed repo" }]).forEach(function (a) { ul.appendChild(el("li", null, a.who + " (" + a.why + ")")); });
  ps.appendChild(ul);
  if (D.report) {
    ps.appendChild(el("h3", null, D.report.ready ? "Ready for review" : "Not ready yet"));
    if (D.report.errors.length) {
      var bl = el("ul", "list blocks"); D.report.errors.forEach(function (x) { bl.appendChild(el("li", null, x)); }); ps.appendChild(bl);
    } else { ps.appendChild(el("p", "small", "Nothing blocks the approval request.")); }
    if (D.report.warnings.length) {
      var det = el("details"); det.appendChild(el("summary", null, D.report.warnings.length + " warning(s)"));
      var wl = el("ul", "list small"); D.report.warnings.forEach(function (x) { wl.appendChild(el("li", null, x)); }); det.appendChild(wl); ps.appendChild(det);
    }
  }

  // tabs
  var tabs = Array.prototype.slice.call(document.querySelectorAll("nav.tabs button"));
  function open(t) {
    tabs.forEach(function (o) {
      var on = o === t;
      o.setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById(o.getAttribute("aria-controls")).hidden = !on;
    });
    var panel = document.getElementById(t.getAttribute("aria-controls"));
    if (t.id === "t-slides") show(); else draw(panel, false);
    try { history.replaceState(null, "", "#" + t.id.slice(2)); } catch (e) {}
  }
  tabs.forEach(function (t) { t.onclick = function () { open(t); }; });
  var start = document.getElementById("t-" + (location.hash || "#design").slice(1)) || tabs[0];
  open(start);
})();
</script>
</body>
</html>
