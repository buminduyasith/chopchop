<!doctype html>

<head>

<style>
/* ---------------------------------------------------------------- tokens */
/* Dark is the default. Light applies only when the reader picked it (data-theme="light"). */
@import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap");

/* "Calm & clear" tokens. Every colour, font and size comes from here. Dark is the default:
   class="cc-dark" on <html>, or "cc-light" when the reader picked light. */
:root {
  --font-sans: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --text-xs: 13px; --text-sm: 14px; --text-md: 15px; --text-base: 17px; --text-lg: 19px;
  --text-h3: 20px; --text-h2: 26px; --text-h1: 40px;
  --leading-body: 1.6; --leading-tight: 1.2; --leading-heading: 1.3;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-7: 28px; --space-10: 40px; --space-24: 96px;
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px; --radius-xl: 14px;
  --radius-2xl: 16px; --radius-3xl: 20px; --radius-pill: 999px;
  --page-max: 1120px; --page-pad-x: 24px; --touch-min: 44px;
  --top: 60px;

  /* The names the rest of this page used before, mapped onto the guide's roles. */
  --ink: var(--text); --ink-2: var(--text2); --raised: var(--card); --code-bg: var(--chip); --paper: var(--surface);
  --accent-soft: var(--accentSoft); --accent-line: var(--cardBorder);
  --wait: var(--warnText); --wait-bg: var(--warnSoft); --wait-line: var(--warnBorder);
  --run: var(--accent); --run-bg: var(--accentSoft); --run-line: var(--accent);
  --done: var(--ok); --done-bg: var(--okSoft); --done-line: var(--okBar);
  --stop: var(--orange); --stop-bg: var(--orangeSoft); --stop-line: var(--orange);
  --sans: var(--font-sans); --mono: var(--font-mono);
}
:root, :root.cc-dark {
  --bg: #121314; --surface: #1B1C1E; --text: #ECECEA; --text2: #C9C8C3; --muted: #A3A29C;
  --border: #2C2D30; --divider: #26272A; --accent: #8FA9FF; --accentSoft: #1F2740;
  --ok: #5BD49A; --okBar: #34B27A; --okSoft: #15291F;
  --warnText: #F5C46B; --warnBar: #E0A030; --warnSoft: #221B0E; --warnBorder: #5A4415; --warnPill: #3A2C10;
  --chip: #26272A; --codeBg: #0B0B0C; --codeText: #ECECEA; --stepBg: #ECECEA; --stepText: #121314;
  --track: #2C2D30; --band: #17181A; --bandBorder: #2E2F33; --line: #8C8B86; --card: #232427; --cardBorder: #3A3B3F;
  --changed: #F5B35B; --changedSoft: #3A2A12; --purple: #C4A8FF; --purpleSoft: #2A2140; --orange: #F3AE6B; --orangeSoft: #33220F;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06), -12px 0 32px rgba(0, 0, 0, .55);
  --mark: #5A4A16; --markLine: #E0B44A;
  color-scheme: dark;
}
:root.cc-light {
  --bg: #F6F6F3; --surface: #FFFFFF; --text: #1C1C1A; --text2: #4A4945; --muted: #5F5E5A;
  --border: #E6E5E0; --divider: #EEEDE8; --accent: #2F5BD3; --accentSoft: #EBF0FC;
  --ok: #1F7A4D; --okBar: #1F9D5C; --okSoft: #E8F5EE;
  --warnText: #8A4B05; --warnBar: #E0A030; --warnSoft: #FFF8EC; --warnBorder: #EED6A8; --warnPill: #FBE7C4;
  --chip: #F0EFEA; --codeBg: #1C1C1A; --codeText: #F6F6F3; --stepBg: #1C1C1A; --stepText: #FFFFFF;
  --track: #E6E5E0; --band: #F4F3EF; --bandBorder: #E2E0D9; --line: #8A877F; --card: #FFFFFF; --cardBorder: #D9D7D0;
  --changed: #9A4A0B; --changedSoft: #FDEFD9; --purple: #6B3FC4; --purpleSoft: #F1ECFB; --orange: #9A4A0B; --orangeSoft: #FFF1E6;
  --shadow: 0 0 0 1px rgba(27, 26, 23, .06), -10px 0 30px rgba(27, 26, 23, .14);
  --mark: #FCEBB6; --markLine: #C99A1E;
  color-scheme: light;
}

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--weight-regular) var(--text-base)/var(--leading-body) var(--font-sans); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-xs); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.ic { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
a.ext .ic { width: 11px; height: 11px; margin-left: 3px; vertical-align: -1px; opacity: .75; }

/* state marks: a shape per state */
.mark { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; }
.mark .f { fill: currentColor; }
.mark .s { fill: none; stroke: currentColor; stroke-width: 1.8; }
.mark .ko { fill: none; stroke: var(--raised); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.m-done { color: var(--done); } .m-run { color: var(--run); } .m-wait { color: var(--wait); }
.m-stop { color: var(--stop); } .m-todo, .m-skip { color: var(--cardBorder); }
.m-wait .f { stroke: var(--ink); stroke-opacity: .28; stroke-width: 1; }
.m-run .pulse { transform-origin: 7px 7px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(.6); opacity: 1; } 50% { transform: scale(1); opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .m-run .pulse { animation: none; } }

.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.3; padding: 4px 10px; border: 1px solid var(--cardBorder);
  border-radius: 4px; background: var(--raised); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { border-color: var(--cardBorder); }

.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 1.35; padding: 1px 6px; border: 1px solid var(--cardBorder);
  border-radius: 3px; color: var(--ink-2); background: var(--raised); white-space: nowrap; }
.tag.c::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: var(--c, var(--cardBorder)); flex: none; }
.tag.t-wait { --c: var(--wait); background: var(--wait-bg); border-color: var(--wait-line); color: var(--ink); }
.tag.t-run { --c: var(--run); background: var(--run-bg); border-color: var(--run-line); color: var(--ink); }
.tag.t-done { --c: var(--done); background: var(--done-bg); border-color: var(--done-line); color: var(--ink); }
.tag.t-stop { --c: var(--stop); background: var(--stop-bg); border-color: var(--stop-line); color: var(--ink); }
.tag.t-wait::before { border-radius: 0; transform: rotate(45deg) scale(.86); }
.tag.t-run::before { border-radius: 50%; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

/* ---------------------------------------------------------------- top bar */
.top { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: inline-flex; align-items: center; gap: 7px; font: 700 14px var(--mono); letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.brand .cut { color: var(--accent); letter-spacing: -.12em; }
.where { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
.top nav a.nav { color: var(--ink-2); text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
.top nav a.nav:hover { background: var(--code-bg); }
.top nav a.nav[aria-current="page"] { color: var(--ink); font-weight: 650; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--cardBorder); }
.live.on { color: var(--ink-2); }
.live.on i { background: var(--done); box-shadow: 0 0 0 3px var(--done-bg); }
.skip { position: absolute; left: -999px; top: 6px; z-index: 40; }
.skip:focus { left: 8px; }

main { max-width: 1560px; margin: 0 auto; padding: 16px 16px 40px; min-width: 0; }
main:focus { outline: none; }
.pagehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
.pagehead h1 { font-size: 20px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.pagehead .sub { color: var(--muted); font-size: 13px; }
.crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb a { color: var(--ink-2); }
.num { font-family: var(--mono); color: var(--muted); font-weight: 500; }
h2.sec { font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.note { color: var(--muted); padding: 24px 0; }
.empty { border: 1px dashed var(--cardBorder); border-radius: 5px; padding: 28px 20px; text-align: center; color: var(--ink-2); display: grid; gap: 6px; justify-items: center; }
.empty strong { font-size: 15px; color: var(--ink); }
.empty code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; }
.problem { border: 1px solid var(--stop-line); background: var(--stop-bg); border-radius: 5px; padding: 10px 12px; margin-bottom: 12px; }

/* ---------------------------------------------------------------- filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.filters input[type="search"], .filters select { height: 30px; padding: 0 8px; border: 1px solid var(--cardBorder); border-radius: 4px; background: var(--raised); min-width: 0; }
.filters input[type="search"] { width: min(260px, 100%); }
.filters select { max-width: 100%; }
.filters .check { gap: 6px; padding: 0 4px; }
.filters .count { margin-left: auto; color: var(--muted); font-size: 12.5px; }

/* ---------------------------------------------------------------- home */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: var(--space-5); }
.fcard { border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.fcard:hover { border-color: var(--cardBorder); }
.fcard .ft { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.fcard .ft a { color: var(--ink); font-weight: 650; font-size: 15px; text-decoration: none; overflow-wrap: anywhere; line-height: 1.3; }
.fcard .ft a:hover { text-decoration: underline; }
.fcard .key { margin-left: auto; font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.wb { display: flex; align-items: center; gap: 7px; font-weight: 650; }
.wtext { color: var(--ink-2); overflow-wrap: anywhere; }
.sline { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; height: 6px; }
.sline i { border-radius: 1px; background: var(--border); }
.sline i.done { background: var(--done); }
.sline i.now { background: var(--run); }
.sline i.waiting { background: var(--wait); }
.sline i.skipped { background: repeating-linear-gradient(90deg, var(--cardBorder) 0 3px, transparent 3px 6px); }
.scap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
.sum { padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.sum li { margin: 2px 0; overflow-wrap: anywhere; }
.fcard .sum li > span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.fcard .foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.tbar { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; background: var(--border); }
.tbar i { display: block; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 1px; }
i.b-done { background: var(--done); }
i.b-review { background: var(--done); opacity: .45; }
i.b-committed { background: var(--run); opacity: .45; }
i.b-building { background: var(--run); }
i.b-todo { background: var(--cardBorder); }
.tbar i.b-todo { background: transparent; }
.runfacts { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; }
h2.sec.group-title { margin: 28px 0 10px; }
.small { font-size: 12.5px; margin-top: 8px; }

/* ---------------------------------------------------------------- feature head */
.stepper { list-style: none; padding: 0; margin: 14px 0 12px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.stepper li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; font-size: 12.5px; }
.stepper li::before { content: ""; position: absolute; top: 8px; right: 50%; width: 100%; height: 2px; background: var(--cardBorder); }
.stepper li:first-child::before { display: none; }
.stepper li.st-done::before, .stepper li.st-now::before, .stepper li.st-waiting::before { background: var(--done); }
.stepper .dot { position: relative; z-index: 1; background: var(--bg); border-radius: 50%; padding: 0 3px; line-height: 0; }
.stepper .dot .mark { width: 18px; height: 18px; vertical-align: 0; }
.stepper .dot .mark .ko { stroke: var(--bg); }
.stepper .lab { font-weight: 600; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.stepper .st-now .lab, .stepper .st-waiting .lab { color: var(--ink); }
.stepper .st-todo .lab, .stepper .st-skipped .lab { color: var(--muted); font-weight: 500; }
.stepper .stw { font-size: 11.5px; color: var(--muted); }
.waitline { border: 1px solid var(--border); border-radius: 5px; background: var(--surface); padding: 12px 14px; display: grid; gap: 3px; }
.waitline.w-wait { background: var(--wait-bg); border-color: var(--wait-line); }
.waitline.w-run { background: var(--run-bg); border-color: var(--run-line); }
.waitline.w-done { background: var(--done-bg); border-color: var(--done-line); }
.waitline.w-stop { background: var(--stop-bg); border-color: var(--stop-line); }
.waitline .who { font-size: 19px; font-weight: 650; line-height: 1.3; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
.waitline .who .mark { width: 16px; height: 16px; }
.waitline .txt { font-size: 14.5px; overflow-wrap: anywhere; }
.waitline .nxt { font-size: 12.5px; color: var(--ink-2); }
.waitline code { background: var(--raised); border: 1px solid var(--border); padding: 0 5px; border-radius: 3px; }
.tabrow { position: sticky; top: var(--top); z-index: 10; background: var(--bg); margin: 14px 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 9px 11px; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.tabs a.off { color: var(--muted); }
.tabs .n { font: 500 11.5px var(--mono); color: var(--muted); }
.tabs .mark { width: 11px; height: 11px; vertical-align: 0; }
.tabrow .btn { flex: none; margin-bottom: 2px; }

/* ---------------------------------------------------------------- overview */
.over { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px 36px; align-items: start; }
.over > div { display: grid; gap: 26px; min-width: 0; }
.over section { min-width: 0; }
.lead { font-size: 15.5px; line-height: 1.55; padding-left: 20px; }
.lead li { margin: 4px 0; overflow-wrap: anywhere; }
.rows { border-top: 1px solid var(--border); }
.row { display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.row .k { font-weight: 600; }
.row .v { color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }
.row .a { font-size: 12px; color: var(--muted); white-space: nowrap; }
.row .cond { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.more { font-size: 12.5px; margin-top: 8px; display: inline-block; }

/* ---------------------------------------------------------------- documents */
.docwrap { display: grid; grid-template-columns: minmax(0, 1fr) 232px; gap: 32px; align-items: start; }
.docwrap.solo { grid-template-columns: minmax(0, 1fr); }
.doc { min-width: 0; }
.dochead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.dochead .path { font-family: var(--mono); font-size: 12px; }
.dochead .btn { margin-left: auto; }
.toc { position: sticky; top: calc(var(--top) + 52px); max-height: calc(100vh - var(--top) - 72px); overflow: auto; font-size: 12.5px; border-left: 1px solid var(--border); padding-left: 14px; }
.toc summary { font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); cursor: pointer; margin-bottom: 6px; }
.toc ul { list-style: none; padding: 0; display: grid; gap: 1px; }
.toc a { display: block; padding: 2px 0; color: var(--ink-2); text-decoration: none; overflow-wrap: anywhere; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
.toc .l1 { font-weight: 650; color: var(--ink); margin-top: 6px; }
.toc .l3 { padding-left: 12px; color: var(--muted); }
.md { font-size: 14.5px; line-height: 1.62; overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md :is(h1, h2, h3, h4, h5, h6):focus { outline: none; }
.md :is(h1, h2, h3, h4, h5, h6) { line-height: 1.3; scroll-margin-top: calc(var(--top) + 56px); letter-spacing: -.005em; }
.md h1 { font-size: 21px; margin: 26px 0 12px; }
.md h2 { font-size: 17px; margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid var(--border); }
.md h3 { font-size: 15px; margin: 20px 0 6px; }
.md :is(h4, h5, h6) { font-size: 14px; margin: 16px 0 4px; }
.md p { margin: 9px 0; }
.md :is(ul, ol) { margin: 9px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li > :is(ul, ol) { margin: 3px 0; }
.md li.task { list-style: none; margin-left: -20px; }
.md li.task input { margin: 0 4px 0 0; vertical-align: -1px; accent-color: var(--done); }
.md code { font-size: 12.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.md pre.code { background: var(--codeBg); color: var(--codeText); padding: var(--space-4) var(--space-5); border-radius: var(--radius-md); overflow: auto; max-width: 100%; font: var(--weight-medium) var(--text-sm)/1.6 var(--font-mono); margin: var(--space-3) 0 var(--space-4); overflow-wrap: normal; }
.md pre.code code { background: none; padding: 0; font-size: inherit; white-space: pre; }
.md pre.raw { white-space: pre-wrap; overflow-wrap: anywhere; }
.md .tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 4px; max-width: 100%; overflow-wrap: break-word; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 1.5; }
.md :is(th, td) { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; min-width: 7.5em; }
.md :is(th, td):first-child { min-width: 2.5em; }
.md th { background: var(--code-bg); font-weight: 650; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md .al-c { text-align: center; } .md .al-r { text-align: right; }
.md blockquote { margin: 10px 0; padding: 1px 14px; border-left: 3px solid var(--cardBorder); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
.md del { color: var(--muted); }
.md .img-ref { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--cardBorder); border-radius: 3px; padding: 0 5px; }
.md .summary { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 5px; padding: 12px 16px; margin: 14px 0; font-size: 15px; }
.md .summary :is(h1, h2, h3) { border: 0; margin: 0 0 4px; padding: 0; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.md .summary > :last-child { margin-bottom: 0; }
.md .diagram { margin: 12px 0; border: 1px solid var(--border); border-radius: 4px; overflow: auto; max-width: 100%; background: var(--surface); }
.md .diagram.drawn { background: var(--paper); padding: 12px; }
.md .diagram.drawn svg { display: block; margin: 0 auto; }
/* Every drawing is made for white paper (chopchop's own colours are fixed). In dark, turn the whole drawing dark instead. */

.md .diagram pre.mermaid { margin: 0; padding: 10px 12px; font: 12px/1.5 var(--mono); white-space: pre; color: var(--ink-2); overflow-wrap: normal; }
.md .diagram .drawing { padding: 12px; min-width: min-content; background: var(--paper); }
.md .diagram .drawing svg { display: block; margin: 0 auto; }
.md .diagram .dnote { margin: 0; padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--bg); position: sticky; left: 0; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
.pane { border: 1px solid var(--border); border-radius: 5px; background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane > header { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; flex: none; }
.pane > header h2 { font-size: 14px; }
.pane > header .btn { margin-left: auto; }
.pane .scroll { overflow: auto; padding: 10px 12px 28px; flex: 1; min-height: 0; }
.pane .md { font-size: 14px; }
.pane .md h1 { font-size: 18px; margin-bottom: 8px; }
.pane .md h2 { font-size: 16px; }
.pane .md :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 8px; }
.pane .toc, .drawer .toc { position: static; max-height: none; border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px; margin-bottom: 10px; }
.pane .toc summary, .drawer .toc summary { margin: 0; }
.pane .toc[open] summary, .drawer .toc[open] summary { margin-bottom: 6px; }
/* The reading mode has no page scroll: the header, one title line, the tabs, then the panes down to the window's edge. */
main.reading { max-width: none; height: calc(100vh - var(--top)); padding: 8px 12px 10px; display: flex; flex-direction: column; overflow: hidden; }
main.reading .crumb { margin: 0; flex: none; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
main.reading .crumb .ttl { overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600; min-width: 0; }
main.reading .tabrow { position: static; margin: 2px 0 8px; flex: none; }
main.reading .tabbody { flex: 1; min-height: 0; display: flex; }

/* ---------------------------------------------------------------- tasks */
.board { display: grid; grid-template-columns: repeat(5, minmax(196px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { min-width: 0; }
.col > h3 { font-size: 12.5px; font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; border-bottom: 2px solid var(--cardBorder); margin-bottom: 8px; }
.col > h3 .n { font: 500 12px var(--mono); color: var(--muted); }
.col .list { display: grid; gap: 8px; align-content: start; min-height: 40px; }
.col .none { font-size: 12.5px; color: var(--muted); padding: 6px 2px; }
.tcard { position: relative; border: 1px solid var(--border); border-radius: 4px; background: var(--raised); padding: 8px 10px; display: grid; gap: 5px; min-width: 0; }
.tcard:hover, .tcard.open { border-color: var(--ink-2); }
.tcard.open { box-shadow: inset 3px 0 0 var(--accent); }
.tcard .tt { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 11.5px; color: var(--muted); }
.tcard .tid { font: 650 12px var(--mono); color: var(--ink); }
.tcard a.t { color: var(--ink); text-decoration: none; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.tcard a.t::after { content: ""; position: absolute; inset: 0; }
.tcard .tsum { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tcard .tauto { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; overflow-wrap: anywhere; }
.tcard .tauto .mark { margin-top: 2px; width: 12px; height: 12px; }
.tcard .tauto.stop { color: var(--ink); font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgba(8, 8, 7, .45); z-index: 29; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, calc(100vw - 56px)); background: var(--bg); box-shadow: var(--shadow); z-index: 30; display: flex; flex-direction: column; }
.drawer > header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; background: var(--surface); }
.drawer > header h2 { font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.drawer .body { overflow: auto; padding: 14px 16px 48px; flex: 1; min-height: 0; }
.drawer .box { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); padding: 8px 12px; margin: 10px 0 14px; font-size: 13px; display: grid; gap: 4px; }
.drawer .box.stop { background: var(--stop-bg); border-color: var(--stop-line); }
.drawer details.files { font-size: 12.5px; margin: 8px 0; }
.drawer details.files ul { padding-left: 18px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- review */
.prlist { border-top: 1px solid var(--border); margin-bottom: 12px; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: center; }
.pr .ti { min-width: 0; overflow-wrap: anywhere; }
.pr .ti .id { font: 600 12.5px var(--mono); margin-right: 8px; }
.pr .meta { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.counts .tag { font-size: 12px; padding: 2px 8px; }
.counts .tag b { font-family: var(--mono); font-weight: 650; }
.group { border: 1px solid var(--border); border-radius: 5px; background: var(--surface); margin: 12px 0; min-width: 0; }
.group > header { padding: 10px 14px; display: grid; gap: 7px; }
.group h3 { font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
.group .plain { font-size: 14.5px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { overflow-wrap: anywhere; min-width: 0; }
.kv ul { padding-left: 18px; }
.kv .ev { font-family: var(--mono); font-size: 12px; }
.cm { padding: 10px 14px; border-top: 1px solid var(--border); display: grid; gap: 6px; min-width: 0; }
.cm.dim { opacity: .68; }
.cm .by { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.cm .by b { color: var(--ink); font-size: 13.5px; }
.cm .loc { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.cm .said { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; background: none; border-left: 3px solid var(--accent-line); border-radius: 0; padding: 2px 0 2px 12px; color: var(--ink-2); }
.cm .plain { font-size: 14.5px; overflow-wrap: anywhere; }
.cm details > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); width: max-content; max-width: 100%; }
.cm details[open] > summary { margin-bottom: 8px; }
.cm .replies { border-left: 2px solid var(--cardBorder); padding-left: 10px; display: grid; gap: 6px; font-size: 13px; }
.cm .replies p { white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { display: flex; gap: 8px; align-items: flex-start; }
.reply p { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); background: var(--raised); border-radius: 4px; padding: 6px 9px; }
.call { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.call .hint { color: var(--muted); font-size: 12.5px; }

/* ---------------------------------------------------------------- activity */
.feed { list-style: none; padding: 0; }
.feed li { display: grid; grid-template-columns: 54px 86px minmax(0, 1fr); gap: 4px 10px; padding: 6px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.feed li.day { display: block; font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--cardBorder); }
.feed li.day:first-child { padding-top: 0; }
.feed .at { font: 500 12px var(--mono); color: var(--muted); }
.feed .tx { overflow-wrap: anywhere; min-width: 0; }
.feed .tx .tag { margin-left: 6px; }

/* ---------------------------------------------------------------- a narrow desktop pane (about 640 to 980 px) */
@media (max-width: 980px) {
  .tabrow .btn .long { display: none; }
  .over { grid-template-columns: minmax(0, 1fr); }
  .docwrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .docwrap .toc { position: static; max-height: none; order: -1; border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px; margin-bottom: 12px; }
  .docwrap .toc summary { margin: 0; }
  .docwrap .toc[open] summary { margin-bottom: 6px; }
  .where { max-width: 28vw; }
  /* the board becomes five rows, so no task card gets squeezed */
  .board { grid-template-columns: minmax(0, 1fr); overflow: visible; gap: 14px; }
  .col .list { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); min-height: 0; }
  .stepper .stw { font-size: 11px; }
}

/* Code colours, like VS Code Dark+. Code always sits on --codeBg, which is dark in both themes. */
:root {
  --hl-kw: #569cd6; --hl-ctrl: #c586c0; --hl-str: #ce9178; --hl-num: #b5cea8; --hl-com: #6a9955; --hl-fn: #dcdcaa;
  --hl-type: #4ec9b0; --hl-var: #9cdcfe; --hl-attr: #9cdcfe; --hl-tag: #569cd6; --hl-meta: #c586c0; --hl-del: #f48771;
  --hl-add: #89d185; --hl-sel: #d7ba7d; --hl-lit: #569cd6;
}
.md pre.code { position: relative; }
.md pre.code[data-lang]::after { content: attr(data-lang); position: absolute; top: 4px; right: 8px; font: 10.5px/1 var(--mono); color: var(--muted); text-transform: lowercase; opacity: .8; pointer-events: none; }
.md pre.code code.hljs { color: var(--codeText); }
.hljs-keyword, .hljs-built_in.hljs-keyword, .hljs-doctag { color: var(--hl-kw); }
.hljs-literal { color: var(--hl-lit); }
.hljs-keyword.hljs-control, .hljs-meta .hljs-keyword { color: var(--hl-ctrl); }
.hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-template-variable, .hljs-char.escape_ { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-title.function_, .hljs-title.function_.invoke__, .hljs-function .hljs-title { color: var(--hl-fn); }
.hljs-title.class_, .hljs-title.class_.inherited__, .hljs-type, .hljs-built_in { color: var(--hl-type); }
.hljs-variable, .hljs-params, .hljs-property, .hljs-variable.language_ { color: var(--hl-var); }
.hljs-attr, .hljs-attribute { color: var(--hl-attr); }
.hljs-name, .hljs-tag { color: var(--hl-tag); }
.hljs-meta, .hljs-meta .hljs-string { color: var(--hl-meta); }
.hljs-selector-class, .hljs-selector-id, .hljs-selector-tag, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--hl-sel); }
.hljs-section { color: var(--hl-kw); font-weight: 600; }
.hljs-deletion { color: var(--hl-del); }
.hljs-addition { color: var(--hl-add); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 600; }

/* Changes: the spec's files as an editor's explorer, with git colours. */
:root { --g-new: #73c991; --g-change: #e2c08d; --g-delete: #f47067; --ex-sel: #04395e; --ex-hover: #2a2d2e; --ex-guide: #3e3e3e; }
:root[data-theme="light"] { --g-new: #2e7d32; --g-change: #895503; --g-delete: #ad0707; --ex-sel: #dde6f6; --ex-hover: #eef0f3; --ex-guide: #d4d4d4; }
.ch-tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 4px 0 12px; }
.ch-tools input[type=search] { flex: 1 1 200px; max-width: 320px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 12.5px; background: none; border: 0; border-right: 1px solid var(--border); color: var(--ink-2); padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--ink); }
.seg button:disabled { opacity: .45; cursor: default; }
.seg .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; }
.seg .s-new .n { color: var(--g-new); } .seg .s-change .n { color: var(--g-change); } .seg .s-delete .n { color: var(--g-delete); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.ex-wrap { display: grid; grid-template-columns: minmax(300px, 520px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .ex-wrap { grid-template-columns: minmax(0, 1fr); } }
.explorer { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 4px 0 8px; font: 13px/22px var(--sans); overflow: hidden; }
.ex-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ex-head .ex-sum { text-transform: none; letter-spacing: 0; font-weight: 400; }
.ex-row { display: flex; align-items: center; gap: 4px; width: 100%; height: 22px; padding: 0 10px 0 calc(6px + var(--d, 0) * 12px); background: none; border: 0; border-left: 2px solid transparent;
          color: var(--ink); font: inherit; text-align: left; cursor: pointer; text-decoration: none; white-space: nowrap; position: relative; }
.ex-row:hover { background: var(--ex-hover); text-decoration: none; }
.ex-row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.ex-row.on { background: var(--ex-sel); border-left-color: var(--accent); }
.ex-row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ex-repo { font-weight: 700; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); padding-left: 6px; margin-top: 2px; }
.ex-counts { margin-left: auto; display: inline-flex; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0; }
.chev { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.5; transition: transform .12s; }
.chev.open { transform: rotate(90deg); }
.fold { width: 16px; height: 16px; flex: none; fill: #dcb67a; opacity: .9; }
:root[data-theme="light"] .fold { fill: #c09553; }
.tw { width: 16px; flex: none; }
.fi { flex: none; width: 22px; text-align: center; font: 700 9.5px/1 var(--mono); color: var(--fc); letter-spacing: -.02em; }
.fi .fi-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fc); }
.fi.big { font-size: 13px; width: auto; }
.gd { position: absolute; left: 0; top: 0; bottom: 0; pointer-events: none; }
.gd i { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--ex-guide); }
.gd i:nth-child(1) { left: 25px; }
.gd i:nth-child(2) { left: 37px; }
.gd i:nth-child(3) { left: 49px; }
.gd i:nth-child(4) { left: 61px; }
.gd i:nth-child(5) { left: 73px; }
.gd i:nth-child(6) { left: 85px; }
.gd i:nth-child(7) { left: 97px; }
.gd i:nth-child(8) { left: 109px; }
.gd i:nth-child(9) { left: 121px; }
.gd i:nth-child(10) { left: 133px; }
.gd i:nth-child(11) { left: 145px; }

.ex-row .st { margin-left: auto; padding-left: 10px; font: 600 11.5px/1 var(--mono); }
.ex-row .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.c-new { color: var(--g-new); } .c-change { color: var(--g-change); } .c-delete { color: var(--g-delete); }
.ex-file.c-delete .nm { text-decoration: line-through; }
.ex-dir.c-new .nm, .ex-dir.c-change .nm, .ex-dir.c-delete .nm { color: inherit; }
.ex-tag { font-size: 10.5px; line-height: 15px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
.ex-none { padding: 10px 14px; color: var(--muted); }
.ex-side { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 14px 16px 16px; position: sticky; top: calc(var(--top) + 56px); }
.ex-side h3 { margin: 0; font-size: 16px; }
.ex-side h4 { margin: 14px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ex-side ul { margin: 0; padding-left: 18px; } .ex-side li { margin: 3px 0; }
.ex-crumb { font: 12px/1.4 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.ex-crumb .sep { opacity: .6; }
.ex-title { display: flex; align-items: center; gap: 10px; }
.pill { font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.ex-who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ex-task { font: 12.5px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; }
.ex-task .st-committed, .ex-task .st-done { color: var(--done); } .ex-task .st-building { color: var(--run); } .ex-task .st-in-review { color: var(--wait); }
.ex-repo-sum { margin: 14px 0 0; display: grid; gap: 4px; }
.ex-repo-sum .bars { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
.ex-repo-sum .bar.c-new { background: var(--g-new); } .ex-repo-sum .bar.c-change { background: var(--g-change); } .ex-repo-sum .bar.c-delete { background: var(--g-delete); }
.ex-legend { display: flex; gap: 14px; margin-top: 16px; font: 600 12px var(--mono); }

.explorer.embed { margin: 10px 0 18px; max-width: 980px; }
.explorer.embed .ex-sum { display: inline-flex; gap: 10px; align-items: center; font-weight: 600; }
.explorer.embed .ex-open { font-weight: 500; text-transform: none; }
.explorer details > summary { list-style: none; }
.explorer details > summary::-webkit-details-marker { display: none; }
.explorer details:not([open]) > summary .chev { transform: none; }
.explorer details[open] > summary .chev { transform: rotate(90deg); }
.explorer .why { color: var(--muted); font-size: 12px; margin-left: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.explorer.embed .ex-row .st { margin-left: 8px; }
.md .ch-embed > .explorer { font-size: 13px; }
.md blockquote { margin: 8px 0 12px; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent-line); color: var(--ink-2); background: none; }

/* ================================================================ "Calm & clear" layout and components */
body { font-size: var(--text-base); }
.top { height: var(--top); padding: 0 var(--page-pad-x); gap: var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font: var(--weight-bold) var(--text-lg) var(--font-sans); letter-spacing: -.01em; gap: var(--space-1); }
.brand .cut { letter-spacing: -.05em; }
.where { font-size: var(--text-md); color: var(--muted); }
.top nav { gap: var(--space-2); }
.top nav a.nav { font-size: var(--text-md); font-weight: var(--weight-medium); color: var(--text2); padding: 0 var(--space-3); min-height: var(--touch-min);
                 display: inline-flex; align-items: center; border-radius: var(--radius-md); }
.top nav a.nav:hover { background: var(--chip); }
.top nav a.nav[aria-current="page"] { color: var(--text); font-weight: var(--weight-semibold); }

  return answer(res);

  const res = await fetch(path, { method: "POST", cache: "no-store",

  return answer(res);

async function answer(res) {
  if (!res.ok) {
    let msg = "The dashboard answered " + res.status + ".";
    try { const body = await res.json(); if (body && body.error) msg = String(body.error); } catch (e) { /* not JSON */ }
    const err = new Error(msg);

}

    const hit = f.docs.find(function (d) { return d.key === key; });

  if (r.tab === "compare") return [DOC_PATH.design, DOC_PATH.spec];
  if (r.tab === "tasks" && r.task && f && Array.isArray(f.tasks)) {
    const t = f.tasks.find(function (x) { return x.id === r.task; });

  catch (e) { S.docs[docKey(n, path)] = e.status === 404 ? { missing: true } : { error: e.message }; }

  try { S.home = await api("/api/features"); S.homeErr = null; }
  catch (e) { S.homeErr = e.message; }

async function load() {
  const r = S.route, seq = ++S.seq;
  const current = function () { return seq === S.seq; };
  if (r.view === "home") {
    await loadHome();
  } else if (r.view === "feature") {
    const known = docsFor(r, S.feature[r.n]);
    const first = [api("/api/feature/" + r.n).then(function (d) { S.feature[r.n] = d; delete S.featErr[r.n]; },
                                                    function (e) { S.featErr[r.n] = e.message; })];
    for (const p of known) first.push(loadDoc(r.n, p));
    const notedAt = notesPath(r);
    if (notedAt) first.push(loadNotes(r.n, notedAt));

    if (!current()) return;
    const noted = notesPath(r);
    if (noted && noted !== notedAt) await loadNotes(r.n, noted);
    const more = docsFor(r, S.feature[r.n]).filter(function (p) { return known.indexOf(p) < 0; });
    if (more.length) { render(); await Promise.all(more.map(function (p) { return loadDoc(r.n, p); })); }

    catch (e) { S.prErr[r.slug] = e.message; }

function parseRoute() {
  const raw = (location.hash || "").replace(/^#/, "") || "/";
  const cut = raw.indexOf("?");

  const query = new URLSearchParams(cut < 0 ? "" : raw.slice(cut + 1));

  catch (e) { return { view: "lost" }; }
  if (!seg.length) return { view: "home", query: query };
  const fm = seg[0] === "f" ? /^(\d{1,9})(?:-[\w.~+-]*)?$/.exec(seg[1] || "") : null;
  if (fm) {
    const r = { view: "feature", n: parseInt(fm[1], 10), tab: seg[2] || "overview", key: seg[1] };
    if (r.tab === "doc") { r.doc = seg.slice(3).join("/"); if (!r.doc) r.tab = "overview"; }
    else if (r.tab === "tasks") r.task = seg[3] || null;
    else if (r.tab === "changes") r.file = seg.slice(3).join("/") || null;
    else if (["overview", "review", "activity", "compare"].indexOf(r.tab) < 0) return { view: "lost" };
    return r;
  }
  if (seg[0] === "pr" && seg[1] && seg.length === 2) return { view: "pr", slug: seg[1] };
  if (seg[0] === "system" && seg.length === 1) return { view: "system" };
  return { view: "lost" };
}

  if (!w) return { cls: "todo", label: "Nothing is waiting" };

function copyText(text, btn, target) {
  // Copy plain text, then say so on the button. With no clipboard, select the target (or a hidden copy of the text).
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  const done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = label; }, 1600); };
  const select = function () {
    let spare = null;
    if (!target) {
      spare = el("textarea", { readonly: true, "aria-hidden": "true", style: "position:fixed;top:0;left:-9999px" });
      spare.value = text;
      document.body.append(spare);
      spare.select();
    } else {
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    if (spare) spare.remove();
    if (ok) done();
    else { btn.textContent = target ? "Selected: press Ctrl+C" : "Could not copy"; setTimeout(function () { btn.textContent = label; }, 4000); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, select);
  else select();
}

const LANG_ALIAS = { sh: "bash", shell: "bash", zsh: "bash", console: "bash", js: "javascript", mjs: "javascript", cjs: "javascript",
                     ts: "typescript", tsx: "typescript", jsx: "javascript", py: "python", yml: "yaml", kt: "kotlin",

  if (!c || !c.node.contains(card) || !document.getElementById("view").contains(card)) return null;
  const box = S.notes[docKey(r.n, path)];
  return { n: r.n, path: path, root: c.node, list: box && Array.isArray(box.notes) ? box.notes : [] };
}
function markDiagram(card) {
  // Called at the end of paint() when state is done (every draw and theme change) and from markAfterRender().
  // Outlines each noted box with class note-box and shows a count for whole-diagram notes.
  // A noted box not in the drawing sets note.lost (Box not found). Gives true when a lost flag changed.
  // markAfterRender sets note.lost = "diagram" (Diagram not found) when no card has the note's diagram.
  const at = diagramDoc(card);
  const add = card.querySelector("button.dadd");
  if (add) add.hidden = !at;
  card.querySelectorAll(".note-box").forEach(function (g) { g.classList.remove("note-box"); });
  const old = card.querySelector(".dcount");
  if (old) old.remove();
  if (!at) {
    if (S.pick === card) leavePick();
    return false;
  }
  const mine = at.list.filter(function (x) { return x && x.diagram === card.dataset.title; });
  const whole = mine.filter(function (x) { return !x.box; }).length;
  if (whole) card.querySelector(".dtools").append(el("span", { class: "dcount" }, plural(whole, "note") + " on this diagram"));
  if (card.dataset.state !== "done") return false;   // not drawn: a box cannot be looked for yet
  const boxes = {}, drawn = new Set();
  card.querySelectorAll(".dbox g.node").forEach(function (g) { const b = boxOf(g); if (b) boxes[b.box] = g; });
  // Box not found is decided over every drawn card with this title, so two cards named the same agree.
  at.root.querySelectorAll(".dcard[data-state=done]").forEach(function (c) {
    if (c.dataset.title !== card.dataset.title) return;
    c.querySelectorAll(".dbox g.node").forEach(function (g) { const b = boxOf(g); if (b) drawn.add(b.box); });
  });
  let changed = false;
  mine.forEach(function (note) {
    if (!note.box) return;
    if (boxes[note.box]) boxes[note.box].classList.add("note-box");
    const there = drawn.has(note.box);
    if (!!note.lost === there) changed = true;
    if (there) delete note.lost;
    else note.lost = true;
  });
  return changed;
}
function leavePick() {
  const card = S.pick;
  if (!card) return;
  S.pick = null;
  card.classList.remove("picking");
  const hint = card.querySelector(".dpick");
  if (hint) hint.remove();
  const add = card.querySelector("button.dadd");
  if (add) add.setAttribute("aria-pressed", "false");
}
function startDiagramNote(card) {
  // Add note: on a drawn flowchart the next click on the drawing picks a box, or the empty space for the whole diagram.
  // Any other diagram takes a whole-diagram note at once. A second Add note leaves pick mode.
  if (S.pick === card) { leavePick(); return; }
  leavePick();
  closeNotePop();
  if (!boxPicks(card)) { pickDiagramPlace(card, null); return; }
  S.pick = card;
  card.classList.add("picking");
  card.querySelector("button.dadd").setAttribute("aria-pressed", "true");
  // The drawing takes no focus, so Whole diagram lets a keyboard user finish too.
  const whole = el("button", { type: "button", class: "btn quiet" }, "Whole diagram");
  whole.addEventListener("click", function () { pickDiagramPlace(card, null); });
  card.querySelector(".dbox").after(el("div", { class: "dpick" },
    el("p", { role: "status" }, "Click a box, or the empty space for the whole diagram. Esc stops."), whole));
}
function pickDiagramPlace(card, target) {
  leavePick();
  const at = diagramDoc(card);
  if (!at) return;
  const range = document.createRange();
  range.selectNode(card);
  const place = { heading: headingPath(at.root, range), diagram: card.dataset.title };
  const b = target && boxPicks(card) ? boxOf(target) : null;
  if (b) Object.assign(place, b);
  // notePopover saves the place as is, with changeNotes(S.route.n, docPath(...)) for the open document.
  notePopover(b ? target.closest("g.node") : card.querySelector("button.dadd"), place);
}
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.pick) leavePick(); });
window.addEventListener("hashchange", leavePick);

// ---- a diagram on its own, fitted to the window: zoom in, zoom out, fit, and drag to move around
function openDiagram(card, title, how) {
  const src = card.querySelector(".dbox svg");
  if (!src) return;
  const svgEl = src.cloneNode(true);
  const vb = (svgEl.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
  let w = vb.length === 4 && vb[2] ? vb[2] : src.getBoundingClientRect().width;
  let h = vb.length === 4 && vb[3] ? vb[3] : src.getBoundingClientRect().height;
  svgEl.removeAttribute("width"); svgEl.removeAttribute("height"); svgEl.style.maxWidth = "none";
  const stage = el("div", { class: "dstage" }, svgEl);
  const pct = el("span", { class: "zpct", "aria-live": "polite" }, "100%");
  let scale = 1;
  const apply = function () {
    svgEl.style.width = Math.round(w * scale) + "px";
    svgEl.style.height = Math.round(h * scale) + "px";
    pct.textContent = Math.round(scale * 100) + "%";
  };
  const fit = function () {
    const r = stage.getBoundingClientRect();
    scale = Math.max(0.1, Math.min((r.width - 48) / w, (r.height - 48) / h, 4));
    apply();
    stage.scrollTo(0, 0);
  };
  const zoom = function (k) {
    const r = stage.getBoundingClientRect();
    const cx = (stage.scrollLeft + r.width / 2) / scale, cy = (stage.scrollTop + r.height / 2) / scale;
    scale = Math.max(0.1, Math.min(scale * k, 6));
    apply();
    stage.scrollLeft = cx * scale - r.width / 2;
    stage.scrollTop = cy * scale - r.height / 2;
  };
  const close = el("button", { type: "button", class: "btn", "aria-label": "Close the full view" }, icon("close"), "Close");
  const dlg = el("dialog", { class: "dview", "aria-label": title },
    el("div", { class: "dvhead" },
       el("div", { class: "dvt" }, el("h2", null, title), how ? el("p", null, how) : null),
       el("div", { class: "dvtools", role: "group", "aria-label": "Zoom" },
          el("button", { type: "button", class: "btn quiet", "aria-label": "Zoom out", on: { click: function () { zoom(1 / 1.25); } } }, "−"),
          pct,
          el("button", { type: "button", class: "btn quiet", "aria-label": "Zoom in", on: { click: function () { zoom(1.25); } } }, "+"),
          el("button", { type: "button", class: "btn quiet", on: { click: fit } }, "Fit"),
          close)),
    stage,
    el("p", { class: "dvhint" }, "Drag to move around. Use + and − or Ctrl and the mouse wheel to zoom. Esc closes."));
  close.addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("close", function () { dlg.remove(); });
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "+" || e.key === "=") { e.preventDefault(); zoom(1.25); }
    else if (e.key === "-") { e.preventDefault(); zoom(1 / 1.25); }
    else if (e.key === "0") { e.preventDefault(); fit(); }
  });
  stage.addEventListener("wheel", function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });
  let drag = null;
  stage.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add("grab");
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag) return;
    stage.scrollLeft = drag.l - (e.clientX - drag.x);
    stage.scrollTop = drag.t - (e.clientY - drag.y);
  });
  const stop = function () { drag = null; stage.classList.remove("grab"); };
  stage.addEventListener("pointerup", stop);
  stage.addEventListener("pointercancel", stop);
  document.body.append(dlg);
  dlg.showModal();
  requestAnimationFrame(fit);
}

async function paint(m, card) {
  const box = card.querySelector(".dbox");
  const id = "mmd-" + (++S.mmd);
  try {
    const out = await m.render(id, themedSource(card.dataset.src));
    box.innerHTML = out.svg;            // drawn by Mermaid in strict mode, from text it treats as text
    card.dataset.state = "done";
    const fb = card.querySelector("button.full");
    if (fb) fb.disabled = false;
    box.title = "Click to see the whole diagram";
    const old = card.querySelector(".dnote");
    if (old) old.remove();
  } catch (e) {
    card.dataset.state = "failed";
    box.replaceChildren(el("p", { class: "dnote" }, "This diagram could not be drawn. Its source is below."));
    card.querySelector("pre.dsrc").hidden = false;
    const junk = document.getElementById("d" + id) || document.getElementById(id);
    if (junk) junk.remove();
  }
  if (markDiagram(card)) redraw();   // noted boxes are outlined again after each draw and theme change; a lost box redraws the list
}
async function drawMermaid(root) {
  const pres = Array.from(root.querySelectorAll("pre.mermaid"));
  const cards = pres.map(diagramCard).concat(Array.from(root.querySelectorAll(".dcard")).filter(function (c) { return !c.dataset.state && pres.indexOf(c) < 0; }));
  const todo = cards.filter(function (c, i) { return cards.indexOf(c) === i && !c.dataset.state; });
  if (!todo.length) return;
  todo.forEach(function (c) { c.dataset.state = "wait"; });
  let m;
  try { m = await loadMermaid(); }
  catch (e) {
    todo.forEach(function (c) {
      c.dataset.state = "";
      c.querySelector(".dbox").replaceChildren(el("p", { class: "dnote" }, "The drawing tool could not load, so you may be offline. The source is below."));
      c.querySelector("pre.dsrc").hidden = false;
    });
    return;
  }
  mermaidSetup(m);
  for (const c of todo) await paint(m, c);
}
async function repaintDiagrams() {
  // after a theme change: draw every diagram again in the new colours
  if (!window.mermaid) return;
  mermaidSetup(window.mermaid);
  for (const c of Array.from(document.querySelectorAll(".dcard[data-state=done]"))) await paint(window.mermaid, c);
}
// ------------------------------------------------------------------ live updates

let es = null, retry = 0, retryTimer = null, flushTimer = null;
const pending = { features: new Set(), prs: new Set(), system: false, home: false };
function setLive(on) {
  const box = document.getElementById("live");
  box.classList.toggle("on", on);
  document.getElementById("live-text").textContent = on ? "Live" : "Reconnecting";
  box.title = on ? "Live: the page updates by itself when a file changes" : "The link to the dashboard dropped. It reconnects by itself.";
}
function schedule() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, Math.min(10000, 1000 * Math.pow(2, retry++)));
}
function connect() {
  if (es || document.hidden) return;
  try { es = new EventSource("/api/stream"); }
  catch (e) { setLive(false); schedule(); return; }
  es.addEventListener("hello", function () {
    setLive(true);
    retry = 0;
    if (S.dropped) {   // we may have missed changes (or the server restarted): read again what is on screen
      S.dropped = false;
      S.feature = keepOnly(S.feature);
      if (S.route.view !== "home") loadHome();
      if (S.route.view === "feature" && S.route.n) pending.features.add(Number(S.route.n));
      pending.home = true;
      flush();
    }
  });
  es.addEventListener("changed", function (ev) {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    (m.features || []).forEach(function (n) { pending.features.add(Number(n)); });
    (m.prs || []).forEach(function (s) { pending.prs.add(String(s)); });
    pending.system = pending.system || !!m.system;
    pending.home = pending.home || !!m.home;
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 200);
  });
  es.onerror = function () {
    setLive(false);
    S.dropped = true;
    if (es && es.readyState === 2) { es = null; schedule(); }   // the browser gave up: try again ourselves
  };
}
function keepOnly(map) {
  const r = S.route, out = {};
  if (r.view === "feature" && map[r.n]) out[r.n] = map[r.n];
  return out;
}
function flush() {
  const r = S.route;
  const feats = pending.features, prs = pending.prs, sys = pending.system, home = pending.home;
  pending.features = new Set(); pending.prs = new Set(); pending.system = false; pending.home = false;
  feats.forEach(function (n) {
    if (r.view === "feature" && r.n === n) return;
    delete S.feature[n];
    Object.keys(S.docs).forEach(function (k) { if (k.indexOf(n + "|") === 0) delete S.docs[k]; });
  });
  prs.forEach(function (s) { if (!(r.view === "pr" && r.slug === s)) delete S.pr[s]; });
  if (sys && r.view !== "system") S.system = null;
  if (r.view === "home") { if (feats.size || prs.size || home || sys) load(); return; }
  if (home || sys) loadHome();
  if ((r.view === "feature" && feats.has(r.n)) || (r.view === "pr" && prs.has(r.slug)) || (r.view === "system" && sys)) load();
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    // A hidden tab gives its connection back, so many open tabs never use up the browser's limit.
    if (es) { es.close(); es = null; }
    clearTimeout(retryTimer);
    S.dropped = true;
  } else {
    connect();
    reloadNotes();   // another tab may have saved notes on this document
  }
});

// ------------------------------------------------------------------ theme, clicks, keys

function themeButton() {
  const btn = document.getElementById("theme");
  const dark = isDark();
  btn.replaceChildren(icon(dark ? "sun" : "moon"), document.createTextNode(dark ? "Light" : "Dark"));
  btn.setAttribute("aria-label", dark ? "Switch to the light theme" : "Switch to the dark theme");
}
document.getElementById("theme").addEventListener("click", function () {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  document.documentElement.className = "cc-" + next;
  repaintDiagrams();
  try { localStorage.setItem("chopchop-theme", next); } catch (e) { /* no storage: it lasts until the page closes */ }
  themeButton();
});
document.getElementById("skip").addEventListener("click", function () { document.getElementById("view").focus(); });

document.addEventListener("click", function (e) {
  const a = e.target.closest ? e.target.closest("a") : null;
  if (!a) return;
  const jump = a.dataset.toc || a.dataset.anchor;
  if (jump) {
    e.preventDefault();
    const scope = a.closest(".docwrap") || document.getElementById("view");
    const target = scope.querySelector('[id="' + String(jump).replace(/["\\]/g, "") + '"]');
    if (target) {
      target.scrollIntoView({ block: "start", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      target.setAttribute("tabindex", "-1");
      target.focus({ preventScroll: true });
    }
    return;
  }
});
document.addEventListener("keydown", function (e) {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target && e.target.tagName) || "");
  if (e.key === "Escape" && S.route.view === "feature" && S.route.task) { e.preventDefault(); closeDrawer(); return; }
  if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const q = document.getElementById("f-q");
    if (q) { e.preventDefault(); q.focus(); }
  }
});

try { history.scrollRestoration = "manual"; } catch (e) { /* not supported: fine */ }
window.addEventListener("hashchange", onRoute);
themeButton();
if (!location.hash) history.replaceState(null, "", "#/");
onRoute();
if (S.route.view !== "home") loadHome();
connect();
})();
</script>
