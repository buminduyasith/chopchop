# Relay team config. Lives in _relay/ (the spec repo). No secrets here:
# ${VAR} values are read from environment variables at run time.

team: my-team

tracker:
  provider: jira            # jira | file | <your own, see providers/README.md>
  mode: rest                # rest = scripts call the API | mcp = the agent uses MCP tools, then ingests
  url: ${RELAY_TRACKER_URL}           # https://yourcompany.atlassian.net
  email: ${RELAY_TRACKER_EMAIL:-}     # Jira Cloud only (basic auth with an API token)
  token: ${RELAY_TRACKER_TOKEN}       # Cloud: API token · Server/DC: personal access token
  # auth: basic             # basic (email + token) | bearer (PAT). Default: basic when email is set.

  jira:
    # deployment: cloud     # cloud | server. Default: cloud for *.atlassian.net, else server.
    # epic_children_jql: "parent = {epic} AND issuetype not in subTaskIssueTypes() ORDER BY rank"
    fields:
      # Names or ids (customfield_10035). Leave out to use the common defaults.
      # acceptance_criteria: "Acceptance Criteria"
      # story_points: "Story Points"
    # extra_fields: ["Business Value", "Out of scope"]   # more fields to copy into each story
    include_comments: false   # true = copy story comments into requirement.md
    max_comments: 50
